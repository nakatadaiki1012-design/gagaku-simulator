<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雅楽 合奏の間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
/* Layout: 3Dの舞台（16人の管絃）を主役に、その下に「拍子の輪」と進行・再生、さらに下に8楽器のスイッチ。 */
:root{
  --bg:#e9ebe6; --surface:#f6f7f3; --ink:#1c2130; --muted:#5b6270; --line:#c7cbc3;
  --fuki:#2c4799; --hiki:#2a7a66; --uchi:#c0412a; --kin:#9c7a2a;
  --sky1:#f4f3ee; --sky2:#d9ddd5;
  --shadow:0 1px 0 rgba(28,33,48,.06),0 6px 20px -12px rgba(28,33,48,.25);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131a;--surface:#1a1d26;--ink:#ebe8df;--muted:#9a9fab;--line:#2d3140;
  --fuki:#8aa2f2;--hiki:#5cc3a6;--uchi:#f06d4f;--kin:#d9b45c;--sky1:#232838;--sky2:#0d0f15;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131a;--surface:#1a1d26;--ink:#ebe8df;--muted:#9a9fab;--line:#2d3140;
  --fuki:#8aa2f2;--hiki:#5cc3a6;--uchi:#f06d4f;--kin:#d9b45c;--sky1:#232838;--sky2:#0d0f15;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 26px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px;border-radius:10px}

.app{max-width:1180px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:center;gap:12px}
.ttl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.ttl h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:.08em;margin:0;line-height:1.1}
.songbtn{display:inline-flex;align-items:center;gap:6px;padding:0;border-radius:10px}
.songbtn:disabled{color:inherit;cursor:default;opacity:1}
.songbtn svg{width:18px;height:18px;color:var(--muted)}
.songlist{display:grid;gap:8px}
.sc{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.sc.on{border-color:var(--kin);box-shadow:inset 0 0 0 1px var(--kin)}
.sc b{font-family:var(--f-display);font-size:22px} .sc small{color:var(--muted);font-size:12px} .sc span{font-size:13px;color:var(--muted);line-height:1.5}
.sc .trial{display:inline-block;font-size:11px;padding:0 7px;border-radius:7px;background:var(--uchi);color:#fff;margin-left:6px;vertical-align:4px}
.ttl .sub{font-size:13px;color:var(--muted);letter-spacing:.12em}
header .sp{flex:1}
.hbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.hbtn svg{width:16px;height:16px}
.ibtn{width:38px;padding:0;justify-content:center}

/* 3D舞台 */
.stagebox{position:relative;border-radius:22px;overflow:hidden;height:clamp(340px,62vh,640px);
  background:radial-gradient(120% 90% at 50% 10%,var(--sky1),var(--sky2));border:1px solid var(--line);box-shadow:var(--shadow);touch-action:pan-y}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:auto;display:grid;justify-items:center;gap:1px;
  font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1;padding:5px 9px 6px;border-radius:10px;
  background:color-mix(in oklab,var(--surface) 82%,transparent);border:1px solid color-mix(in oklab,var(--g) calc(25% + var(--lv,0)*75%),var(--line));
  color:var(--ink);box-shadow:0 0 calc(var(--lv,0)*18px) color-mix(in oklab,var(--g) 60%,transparent);transition:opacity .25s}
.lb small{font-family:var(--f-body);font-weight:500;font-size:9.5px;color:var(--g);letter-spacing:.06em}
.lb.off{opacity:.45;text-decoration:line-through}
.caption{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;
  font-size:13.5px;font-weight:500;padding:6px 14px;border-radius:16px;background:color-mix(in oklab,var(--ink) 86%,transparent);color:var(--bg);
  opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption.show{opacity:1}
.nogl{pointer-events:none;position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.viewbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px}
/* 合奏に参加 */
.joinbar{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:12px;align-items:center;
  padding:10px 14px 10px 14px;border-radius:18px;background:color-mix(in oklab,var(--surface) 90%,transparent);border:1px solid color-mix(in oklab,var(--g) 45%,var(--line));box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.joinbar[hidden]{display:none}
.jb-name{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1;color:var(--g)}
.jb-how{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.jb-score{font-size:12px;margin-top:4px;color:var(--ink)} .jb-score b{color:var(--g);font-weight:700}
#lane{width:100%;height:70px;display:block;min-width:0}
.jb-hit{position:relative}
.hit{width:78px;height:78px;border-radius:50%;background:var(--g);color:#fff;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.08em;
  touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 6px 18px -6px color-mix(in oklab,var(--g) 70%,transparent);transition:transform .06s,filter .06s}
.hit.on{transform:scale(.92);filter:brightness(1.2)}
.jb-judge{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translate(-50%,6px);white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:18px;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
.jb-judge.show{opacity:1;transform:translate(-50%,0)} .jb-judge.good{color:var(--g)} .jb-judge.ok{color:var(--kin)} .jb-judge.bad{color:var(--muted)}
.jb-x{position:absolute;top:-10px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:16px;line-height:1;box-shadow:var(--shadow)}
.stagebox.joining .caption{bottom:118px}
.zoom{display:grid;gap:8px}
.zstage{position:relative;height:clamp(240px,42vh,360px);border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 15%,var(--sky1),var(--sky2));border:1px solid var(--line);touch-action:none}
.zcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.zlabels{position:absolute;inset:0;pointer-events:none}
.zl{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;font-family:var(--f-display);font-weight:700;font-size:12.5px;line-height:1;padding:4px 7px;border-radius:9px;
  background:color-mix(in oklab,var(--surface) 86%,transparent);border:1px solid color-mix(in oklab,var(--g) 50%,var(--line));color:var(--ink);white-space:nowrap}
.zl.on{background:var(--g);color:#fff;border-color:var(--g)}
.zmode{position:absolute;left:8px;top:8px;display:flex;gap:4px}
.zmode button{font-size:12px;padding:4px 10px;border-radius:14px;background:color-mix(in oklab,var(--surface) 85%,transparent);border:1px solid var(--line)}
.zmode button.on{background:var(--g);color:#fff;border-color:var(--g)}
.zdesc{margin:0;font-size:13px;color:var(--muted);line-height:1.6;min-height:2.6em}
.zdesc b{color:var(--g);font-family:var(--f-display);font-size:15px;margin-right:6px} .zdesc small{margin-right:8px}
.joinlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.jc{display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid color-mix(in oklab,var(--g) 40%,var(--line));background:color-mix(in oklab,var(--g) 6%,var(--surface))}
.jc:disabled{opacity:.45}
.jc b{font-family:var(--f-display);font-size:19px;color:var(--g)} .jc small{font-size:11px;color:var(--g)} .jc span{font-size:12px;color:var(--muted);line-height:1.45}
@media (max-width:480px){ .hbtn .bt{display:none} #joinBtn,#learnBtn{width:38px;padding:0;justify-content:center} }
@media (max-width:620px){ .joinbar{grid-template-columns:1fr auto;gap:6px 10px;padding:8px 10px} .jb-info{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap} .jb-how{display:none}
  .stagebox.joining{height:clamp(460px,72vh,660px)}
  .jb-name{font-size:17px} #lane{height:62px} .hit{width:66px;height:66px;font-size:18px} .stagebox.joining .caption{bottom:136px} }
.viewbtns button{height:30px;padding:0 11px;border-radius:15px;font-size:12px;background:color-mix(in oklab,var(--surface) 85%,transparent);border:1px solid var(--line)}
.viewbtns button.on{border-color:var(--kin);color:var(--kin)}

/* 操作盤 */
.console{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ringwrap{position:relative;width:150px;aspect-ratio:1;max-width:100%}
#ring{width:100%;height:100%;display:block}
.center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.center .sec{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
.center .rep{font-size:10.5px;color:var(--muted);letter-spacing:.14em;margin-top:3px}
.ctrl{display:grid;gap:12px;justify-items:start;min-width:0}
.form{display:flex;gap:6px;flex-wrap:wrap}
.chip{position:relative;overflow:hidden;min-width:40px;height:40px;padding:0 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--f-display);font-weight:700;font-size:17px;display:grid;place-items:center}
.chip .fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--kin)}
.chip.on{border-color:var(--kin);color:var(--kin)}
.chip.sm{font-size:14px}
.transport{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s;flex:none}
.play:active{transform:scale(.95)}
.play svg{width:22px;height:22px}
.tempo{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.tempo button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.tempo b{color:var(--ink);font-weight:500;min-width:58px;text-align:center}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
@media (max-width:560px){
  .stagebox{height:clamp(270px,44vh,360px)}
  .lb{font-size:13px;padding:4px 7px 5px}
  .lb small{display:none}
  .console{grid-template-columns:96px 1fr;gap:10px}
  .ringwrap{width:96px}
  .center .sec{font-size:26px}
  .center .rep{font-size:9px}
  .chip{min-width:27px;height:34px;font-size:14px;border-radius:9px;padding:0 3px}
  .chip.sm{font-size:12px}
  .form{gap:3px}
  .legend{display:none}
}

/* 楽器スイッチ */
.insts{display:flex;flex-wrap:wrap;gap:10px 18px}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp .gl{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--g);padding:4px 6px 4px 0;display:inline-flex;align-items:baseline;gap:5px}
.grp .gl small{font-family:var(--f-body);font-size:10px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.grp .gl.act small{color:var(--g);border-color:var(--g)}
.ic{--lv:0;display:inline-flex;align-items:stretch;border-radius:12px;border:1px solid color-mix(in oklab,var(--g) calc(25% + var(--lv)*75%),var(--line));
  background:color-mix(in oklab,var(--g) calc(var(--lv)*24%),var(--surface));overflow:hidden;transition:opacity .2s}
.ic .t{display:grid;line-height:1.1;padding:6px 6px 6px 11px;text-align:left}
.ic .t b{font-family:var(--f-display);font-weight:800;font-size:17px}
.ic .t small{font-size:9.5px;color:var(--g)}
.ic .i{width:28px;display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:12px;border-left:1px solid var(--line)}
.ic.off{opacity:.42}
.ic.off .t b{text-decoration:line-through}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0}

/* シート */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:22px;width:min(560px,calc(100vw - 24px));max-height:min(86vh,760px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,12,18,.45)}
@media (max-width:620px){dialog{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:22px 22px 0 0;max-height:88vh}}
.sh{padding:22px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;overflow:auto;max-height:inherit}
.shtop{display:flex;align-items:flex-start;gap:12px}
.shtop h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.06em;line-height:1.15}
.shtop .yomi{font-size:12px;color:var(--muted);letter-spacing:.1em}
.shtop .sp{flex:1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.lead{margin:0;font-size:15px;max-width:60ch}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:1px 9px;border:1px solid var(--g);color:var(--g)}
.pads{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
.pad{border-radius:14px;border:1px solid var(--line);background:var(--bg);min-height:64px;display:grid;place-content:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}
.pad b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.pad small{font-size:10.5px;color:var(--muted)}
.pad.wide{grid-column:span 2}
.pad.hit,.pad:active{background:color-mix(in oklab,var(--g) 22%,var(--bg));border-color:var(--g)}
.padlabel{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:-6px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
summary::before{content:"＋ ";color:var(--kin)}
details[open] summary::before{content:"－ "}
details p{margin:.6em 0 0;font-size:14px;max-width:62ch}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sw .t{display:grid}
.sw .t small{color:var(--muted);font-size:12px}
.tog{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog[aria-checked="true"]{background:var(--kin)}
.tog[aria-checked="true"]::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--kin)}
.learn{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.card>button.h{width:100%;display:flex;align-items:center;gap:12px;padding:14px;text-align:left}
.card .n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--kin);width:22px;flex:none}
.card .q{font-weight:700;font-size:15.5px;flex:1}
.card .chev{color:var(--muted);transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.card .b{display:none;padding:0 14px 14px 48px}
.card.open .b{display:grid;gap:10px}
.card .b p{margin:0;font-size:14px;max-width:60ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500}
.act svg{width:12px;height:12px}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--kin);padding-left:10px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="ttl"><button class="songbtn" id="songBtn" aria-label="曲をえらぶ"><h1 id="songT">越天楽</h1><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4.5l3 3 3-3"/></svg></button><span class="sub" id="songS">平調・早四拍子</span><button class="hbtn ibtn" id="songInfo" aria-label="この曲について" style="font-family:var(--f-display);font-weight:700;width:30px;height:30px;align-self:center">i</button></div>
    <span class="sp"></span>
    <button class="hbtn" id="joinBtn" aria-label="合奏に参加"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="2.4"/><path d="M3.2 14c.6-2.9 2.5-4.4 4.8-4.4s4.2 1.5 4.8 4.4"/></svg><span class="bt">参加</span></button>
    <button class="hbtn" id="learnBtn" aria-label="雅楽のしくみ"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5h4.5a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 0-1.5-1.5H2zM14 3.5H9.5A1.5 1.5 0 0 0 8 5v8.5a1.5 1.5 0 0 1 1.5-1.5H14z"/></svg><span class="bt">しくみ</span></button>
    <button class="hbtn ibtn" id="setBtn" aria-label="設定"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h8M13 4h1M2 8h2M7 8h7M2 12h6M11 12h3"/><circle cx="11.5" cy="4" r="1.5"/><circle cx="5.5" cy="8" r="1.5"/><circle cx="9.5" cy="12" r="1.5"/></svg></button>
  </header>

  <section class="stagebox" id="stagebox" aria-label="3Dの雅楽隊">
    <canvas id="gl"></canvas>
    <div class="labels" id="labels"></div>
    <div class="caption" id="caption"></div>
    <div class="joinbar" id="joinbar" hidden>
      <div class="jb-info"><div class="jb-name" id="jbName"></div><div class="jb-how" id="jbHow"></div><div class="jb-score" id="jbScore"></div></div>
      <canvas id="lane" aria-label="流れてくる印"></canvas>
      <div class="jb-hit"><div class="jb-judge" id="jbJudge"></div><button class="hit" id="hitBtn">打つ</button></div>
      <button class="jb-x" id="jbX" aria-label="参加をやめる">×</button>
    </div>
    <div class="viewbtns"><button data-v="front" class="on">正面</button><button data-v="top">真上</button><button data-v="side">横</button></div>
  </section>

  <section class="console" aria-label="拍子と進行">

}

function ks(f,sec,bright,damp,blend=.5){

const state = { on:{}, bpm:BPM_DEFAULT, yuragi:true, ondo:true, playing:false };
Object.keys(INST).forEach(id=>state.on[id]=true);
try{ const s=JSON.parse(localStorage.getItem('gagaku-pref3')||'{}'); if(s.bpm && (!s.song || SONGS[s.song])) state.bpm=s.bpm; /* 消した曲のテンポは引きつがない */ if('yuragi' in s) state.yuragi=s.yuragi; if('ondo' in s) state.ondo=s.ondo; }catch(e){}

let perf=null;
function beatDur(k){
  let d=60/state.bpm;
  if(k<0) return d*1.3;                                  // 音取は拍のない自由な時間
  d *= recSpb(Math.min(k,PIECE-1))/(60/BPM_DEFAULT);    // 録音の速さの変化をなぞる（後半の加拍子で速まる）
  if(state.yuragi) d *= k%4===1 ? 1.12 : (4-1.12)/3;     // 2拍目から3拍目へ少し「ためる」（小拍子全体の長さは変えない）
  if(k>=PIECE-1) d*=1+.05*(k-(PIECE-1));                 // 留手に向けてゆっくり
  return d;
}
// 誰がいつ加わるか（p=0が首席の「主管」、1・2が「助管」）
function joined(id,p,b){
  if(b<0) return p===0;
  if(!perf.ondo) return true;
  if(b<ENTER[id]-.01) return false;
  return p===0 || !['sho','hichiriki','ryuteki'].includes(id) || b>=JOSUKAN;
}
const OFF=[0,.019,-.013], DET=[1,Math.pow(2,7/1200),Math.pow(2,-6/1200)], VG=[1,.72,.66];
function start(fromBeat=0){
  initAudio(); if(ctx.state==='suspended') ctx.resume();
  stop(true);
  const outs={}; Object.keys(INST).forEach(id=>{ const g=ctx.createGain(); g.connect(inst[id].g); outs[id]=g; });
  const t0=ctx.currentTime+.4;
  perf = { outs, from:fromBeat, k:fromBeat, nextT:t0, beatT:{}, vis:[], hits:[], ondo: state.ondo && SONG.ondo && fromBeat<=0, endT:null,
    wind:{hichiriki:[0,1,2].map(p=>new Wind('hichiriki',outs.hichiriki,VG[p])), ryuteki:[0,1,2].map(p=>new Wind('ryuteki',outs.ryuteki,VG[p]))},
    sho:[0,1,2].map(p=>new Sho(outs.sho,VG[p])) };
  perf.beatT[fromBeat]=t0;
  state.playing=true; updatePlay(); lastPhase=null; joinReset(fromBeat);
  perf.timer=setInterval(tick,25); tick();
}
function stop(silent){
  if(!perf) return;
  clearInterval(perf.timer); const t=ctx.currentTime;
  Object.values(perf.outs).forEach(g=>{ g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0,t,.08); setTimeout(()=>g.disconnect(),900); });
  perf.wind.hichiriki.forEach(w=>w.kill(t)); perf.wind.ryuteki.forEach(w=>w.kill(t)); perf.sho.forEach(s=>s.off(t));
  if(!silent) joinFinish(); else if(me){ if(me.wind) me.wind.kill(t); if(me.sho) me.sho.off(t); }
  perf=null; state.playing=false; if(!silent) updatePlay();
}
function included(e){
  if(e.beat<0) return true;
  if(!perf.ondo) return true;
  return !e.fill && e.beat>=ENTER[e.inst]-.01;

// MIDIから取り込んだ琵琶・箏の一音
function rawPluck(e,et,o){
  const ps=[0,1].filter(p=>joined(e.inst,p,e.beat));
  ps.forEach(p=>{ pluck(e.inst,et+p*(e.inst==='biwa'?.016:.014),e.midi,e.vel*(e.inst==='biwa'?1:1.2)*(p?.8:1),o); hit(e.inst,p,et,.5); });

        case 'taiko': drum('taiko',et,e.k,1,o); hit('taiko',0,et,e.k==='do'?1:-.5); perf.vis.push({i:'taiko',t0:et,t1:et+(e.k==='do'?.9:.5),l:e.k==='do'?'百':'図',ps:[0]}); break;

      } }catch(err){ console.warn(err); }

}

  function tomoeTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
    x.fillStyle='#efe6d2'; x.fillRect(0,0,256,256); x.translate(128,128);
    const cols=['#b5402a','#2f5a8f','#2f7a5a'];
    for(let i=0;i<3;i++){ x.save(); x.rotate(i*Math.PI*2/3); x.fillStyle=cols[i]; x.beginPath(); x.arc(0,-40,40,0,Math.PI*2); x.fill();
      x.beginPath(); x.moveTo(40,-40); x.quadraticCurveTo(55,40,-30,70); x.quadraticCurveTo(20,30,0,0); x.closePath(); x.fill(); x.restore(); }
    x.strokeStyle='#1b1b1f'; x.lineWidth=10; x.beginPath(); x.arc(0,0,120,0,Math.PI*2); x.stroke();
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t; }

const lvs={}, hitsNow={};
function frame(ms){
  let pos=null; const clock=ms/1000;
  for(const k in lvs) lvs[k]=0;
  if(perf && ctx){
    const now=ctx.currentTime;
    let k=perf.from; while(perf.beatT[k+1]!==undefined && perf.beatT[k+1]<=now) k++;
    const t0=perf.beatT[k], t1=perf.beatT[k+1];
    pos = now<t0 ? perf.from-.001 : k + (t1? Math.min(1,(now-t0)/(t1-t0)) : 0);
    perf.vis = perf.vis.filter(v=>v.t1>now-1);
    const ilv={};
    for(const v of perf.vis){ if(now>=v.t0 && now<v.t1+.35){
      const sustain=['hichiriki','ryuteki','sho'].includes(v.i);
      const x = now<v.t1 ? (sustain? .9 : 1-(now-v.t0)/(v.t1-v.t0+.001)*.5) : (1-(now-v.t1)/.35)*.35;
      v.ps.forEach(p=>{ if(!(lvs[v.i+p]>x)) lvs[v.i+p]=x; }); if(!(ilv[v.i]>x)) ilv[v.i]=x; } }
    Object.keys(chipsI).forEach(id=>chipsI[id].style.setProperty('--lv',state.on[id]?(ilv[id]||0).toFixed(2):'0'));
    // 打った瞬間（手の動き・波紋）
    perf.hits = perf.hits.filter(h=>h.t>now-.6);
    for(const h of perf.hits){ if(h.t<=now){ const key=h.i+h.p; if(!hitsNow[key] || hitsNow[key].t<h.t){ hitsNow[key]=h; if(three && state.on[h.i] && !h.fired){ h.fired=true; const P=three.players.find(q=>q.id===h.i&&q.p===h.p); if(P && (h.i==='kakko' ? h.s>=.99 : Math.abs(h.s)>=.5)) three.ripple(P,Math.min(1,Math.abs(h.s))); } } } }
    const b=pos, si=Math.floor(Math.max(0,b)/SEC_BEATS);
    if(b<0){ $('#secL').textContent='音'; $('#repL').textContent='音取'; }
    else if(si<FORM.length){ const s=FORM[si]; $('#secL').textContent=s; const nth=FORM.slice(0,si+1).filter(x=>x===s).length; $('#repL').textContent=(perf.ondo && b<ENTER.sho)?'音頭':(nth===1?'一返':'二返'); }
    else { $('#secL').textContent='留'; $('#repL').textContent='留手'; }
    const ci = b<0?0 : si<FORM.length? si+1 : CHIPS.length-1;
    chips.forEach((c,i)=>{ const on=i===ci; c.classList.toggle('on',on);
      let w='0'; if(i<ci) w='100%'; else if(on){ const st=i===0?NETORI:i===CHIPS.length-1?PIECE:(i-1)*SEC_BEATS, len=i===0?-NETORI:i===CHIPS.length-1?END_BEATS:SEC_BEATS; w=Math.min(100,Math.max(0,(b-st)/len*100))+'%'; }
      c.querySelector('.fill').style.width=w; });
    const ph=phaseOf(b); if(ph && ph!==lastPhase){ lastPhase=ph; showCaption(ph); }
  } else { Object.keys(chipsI).forEach(id=>chipsI[id].style.setProperty('--lv','0')); }
  drawRing(pos!==null && pos>=0 && pos<PIECE ? pos : null);
  joinFrame(pos);
  if(three) three.render(ctx?ctx.currentTime:0,lvs,hitsNow,clock,pos);
  requestAnimationFrame(frame);
}

  else if(id==='biwa'||id==='koto'){ let g=null;
    for(const e of ev){ if(!g || e.beat-g.last>=.5){ g={notes:[],last:e.beat}; cues.push(g); } g.notes.push(e); g.last=e.beat; }
    cues.forEach(c=>{ const on=c.notes.find(n=>Math.abs(n.beat-Math.round(n.beat))<.01); c.b=(id==='biwa'&&on?on:c.notes[0]).beat; c.l=RITSU[pc(c.notes[c.notes.length-1].midi)]; }); }

function joinStart(id){
  initAudio(); if(ctx.state==='suspended') ctx.resume();
  me={id,cues:buildCues(id),held:false,sc:{good:0,ok:0,miss:0}};
  Object.keys(INST).forEach(k=>toggle(k,true));
  const bar=$('#joinbar'); bar.hidden=false; $('#stagebox').classList.add('joining');
  bar.style.setProperty('--g',`var(${INST_GROUP[id].tok})`);
  $('#jbName').textContent=INST[id].k; $('#jbHow').textContent=JOIN[id].how; $('#hitBtn').textContent=JOIN[id].verb;
  start(SEC_BEATS-8); // 一返目のAの終わりから（8拍の前置き）
}
function joinReset(from){ if(!me) return; me.cues.forEach(c=>{ c.j=null; }); me.from=from+3; /* 始めてすぐの印は数えない */ me.sc={good:0,ok:0,miss:0}; me.wind=null; me.sho=null; me.held=false; me.lastM=null; joinScore(); }
function joinEnd(){ if(!me) return; me=null; stop(); $('#joinbar').hidden=true; $('#stagebox').classList.remove('joining'); }
function joinScore(){ if(!me) return; $('#jbScore').innerHTML=`<b>良</b> ${me.sc.good}　<b>可</b> ${me.sc.ok}　<b>見逃し</b> ${me.sc.miss}`; }
function joinFinish(){ if(!me) return; me.held=false; if(me.wind) me.wind.kill(ctx.currentTime); if(me.sho) me.sho.off(ctx.currentTime);
  const n=me.sc.good+me.sc.ok+me.sc.miss; if(n) showCaption(`おつかれさま！　良 ${me.sc.good}・可 ${me.sc.ok}・見逃し ${me.sc.miss}`); }
let judgeTimer;
function showJudge(txt,cls){ const j=$('#jbJudge'); j.textContent=txt; j.className='jb-judge show '+cls; clearTimeout(judgeTimer); judgeTimer=setTimeout(()=>j.classList.remove('show'),600); }
function noteAt(b){ let m=null; for(const c of me.cues){ if(c.b>b+.05) break; for(const n of c.notes){ if(n.beat<=b+.02) m=n; } } return m; }
function joinPress(){
  if(!me) return; if(!perf){ start(SEC_BEATS-8); return; }
  const lag=(ctx.outputLatency||ctx.baseLatency||0), b=curBeat(lag), spb=spbNow();
  // いちばん近い、まだ判定していない印
  let best=null, bd=1e9; for(const c of me.cues){ if(c.j || c.b<me.from) continue; const d=Math.abs(c.b-b); if(d<bd){ bd=d; best=c; } if(c.b>b+2) break; }
  let cue=best;
  if(best && bd<1){ const dt=(b-best.b)*spb, a=Math.abs(dt);
    if(a<=JUDGE_GOOD){ best.j='good'; me.sc.good++; showJudge('良','good'); }
    else if(a<=JUDGE_OK){ best.j='ok'; me.sc.ok++; showJudge(dt<0?'可（はやい）':'可（おそい）','ok'); }
    else { showJudge(dt<0?'はやい':'おそい','bad'); }
    joinScore(); }
  else if(!best) return;
  const id=me.id, out=perf.outs[id], T=ctx.currentTime+.005, P=0;
  if(JOIN[id].hold){
    if(!me.wind) me.wind=new Wind(id,out,1);
    const n = b<cue.b ? cue.notes[0] : (noteAt(b)||cue.notes[0]);
    me.wind.hold(f0(n.midi), id==='hichiriki'); me.lastM=n.midi; me.held=true; hit(id,P,T,.6); return; }
  if(id==='sho'){ if(!me.sho) me.sho=new Sho(out,1); me.sho.chord(T,cue.chord); hit(id,P,T,.6); perf.vis.push({i:id,t0:T,t1:T+.6,ps:[0]}); return; }
  if(id==='biwa'||id==='koto'){ const pre=cue.notes.filter(n=>n.beat<cue.b-.01);
    cue.notes.forEach(n=>{ const tt = n.beat<cue.b-.01 ? T+pre.indexOf(n)*.045 : T+pre.length*.045+(n.beat-cue.b)*spb;
      pluck(id,tt,n.midi,n.vel*(id==='biwa'?1:1.2),out); hit(id,P,tt,.5); });
    perf.vis.push({i:id,t0:T,t1:T+.6,ps:[0]}); return; }
  if(id==='kakko'){ const h=kakkoStroke(cue.k,T,spb,out,[],cue.offs&&cue.offs.map(x=>T+x*spb),cue.vels); h.forEach(([tt,v,s])=>hit(id,P,tt,cue.k==='sei'?1:v*(s==='R'?.95:-.95)));
    perf.vis.push({i:id,t0:T,t1:h[h.length-1][0]+.12,ps:[0]}); return; }
  drum(id,T,cue.k,1,out); hit(id,P,T,(cue.k==='do'||cue.k==='chin')?1:-.6); perf.vis.push({i:id,t0:T,t1:T+.5,ps:[0]});
}
function joinRelease(){ if(!me||!me.held) return; me.held=false; if(me.wind) me.wind.release(); }
// 毎フレーム：吹いているあいだの音の高さ、見逃しの判定、流れる印の描画
const lane=$('#lane'), lx=lane.getContext('2d');
function joinFrame(pos){
  if(!me) return;
  const b = perf ? curBeat(ctx.outputLatency||ctx.baseLatency||0) : null;
  if(perf && b!==null){
    if(me.held && me.wind){ const n=noteAt(b); if(n && n.midi!==me.lastM){ me.lastM=n.midi; me.wind.glide(f0(n.midi),ctx.currentTime,me.id==='hichiriki'?.06:.025); }
      const now=ctx.currentTime; perf.vis.push({i:me.id,t0:now,t1:now+.05,ps:[0]}); }
    const spb=spbNow(); for(const c of me.cues){ if(c.b>b) break; if(!c.j && c.b>=me.from && (b-c.b)*spb>JUDGE_OK+.25){ c.j='miss'; me.sc.miss++; joinScore(); } }
  }
  // 描画
  const r=lane.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1);
  if(lane.width!==Math.round(r.width*dpr)){ lane.width=Math.round(r.width*dpr); lane.height=Math.round(r.height*dpr); }
  const W=r.width, H=r.height, g=lx; g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const hitX=Math.min(70,W*.16), ppb=(W-hitX)/6, cy=H*.56, gc=tokens[INST_GROUP[me.id].tok]||tokens['--kin'];
  g.strokeStyle=tokens['--line']; g.lineWidth=1; g.beginPath(); g.moveTo(0,cy); g.lineTo(W,cy); g.stroke();
  const cb = b===null ? SEC_BEATS-8 : b; let lastLX=-99;
  for(const c of me.cues){ if(c.b<cb-2) continue; if(c.b>cb+6.5) break;
    const x=hitX+(c.b-cb)*ppb, done=c.j, a = done==='miss'?.25 : done?.35 : 1;
    g.globalAlpha=a; g.fillStyle=gc; g.strokeStyle=gc;
    if(c.e!=null && (JOIN[me.id].hold || c.e-c.b>.4)){ const x2=hitX+(c.e-cb)*ppb, hh=JOIN[me.id].hold?14:8; g.beginPath(); g.roundRect?g.roundRect(x,cy-hh/2,Math.max(hh,x2-x),hh,hh/2):g.rect(x,cy-hh/2,Math.max(hh,x2-x),hh); g.fill(); }
    const big = c.k==='do'||c.k==='sei'||c.k==='chin'||c.chord||c.notes, rad=big?9:6;
    g.beginPath(); g.arc(x,cy,rad,0,7); g.fill(); g.lineWidth=2; g.strokeStyle=tokens['--surface']; g.stroke();
    if(c.l && x-lastLX>34){ lastLX=x; g.fillStyle=tokens['--ink']; g.font=`700 12px ${getComputedStyle(document.body).fontFamily}`; g.textAlign='center'; g.fillText(c.l,x,cy-15); }
    if(done && done!=='miss'){ g.fillStyle=done==='good'?gc:tokens['--muted']; g.font='800 11px sans-serif'; g.fillText(done==='good'?'良':'可',x,cy+24); }
  }
  g.globalAlpha=1; g.strokeStyle=tokens['--ink']; g.lineWidth=3; g.beginPath(); g.moveTo(hitX,cy-20); g.lineTo(hitX,cy+20); g.stroke();
}
(()=>{ const hb=$('#hitBtn');
  hb.addEventListener('pointerdown',e=>{ e.preventDefault(); hb.setPointerCapture(e.pointerId); hb.classList.add('on'); joinPress(); });
  ['pointerup','pointercancel'].forEach(t=>hb.addEventListener(t,()=>{ hb.classList.remove('on'); joinRelease(); }));
  addEventListener('keydown',e=>{ if(!me || e.repeat || dlg.open) return; if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); hb.classList.add('on'); joinPress(); } });
  addEventListener('keyup',e=>{ if(!me) return; if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); hb.classList.remove('on'); joinRelease(); } });
  $('#jbX').onclick=joinEnd; $('#joinBtn').onclick=joinOpen; })();

renderSwitches(); updatePlay();
try{ initThree(); }catch(e){ console.error(e); }
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{ if(document.hidden && perf) stop(); });
})();
</script>
