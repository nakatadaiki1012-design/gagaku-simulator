<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雅楽 合奏の間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 左に「拍子の輪」（楽太鼓の枠を思わせる円）と進行、右に三つの列（吹物・弾物・打物）の楽器。スマホでは縦一列。 */
:root{
  --bg:#e9ebe6;        /* 胡粉に少し緑青を混ぜた地 */
  --surface:#f6f7f3;
  --ink:#1c2130;
  --muted:#5b6270;
  --line:#c7cbc3;
  --fuki:#2c4799;      /* 吹物 群青 */
  --hiki:#2a7a66;      /* 弾物 緑青 */
  --uchi:#c0412a;      /* 打物 朱 */
  --kin:#9c7a2a;       /* 金 */
  --shadow:0 1px 0 rgba(28,33,48,.06),0 6px 20px -12px rgba(28,33,48,.25);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131a;--surface:#1a1d26;--ink:#ebe8df;--muted:#9a9fab;--line:#2d3140;
  --fuki:#8aa2f2;--hiki:#5cc3a6;--uchi:#f06d4f;--kin:#d9b45c;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131a;--surface:#1a1d26;--ink:#ebe8df;--muted:#9a9fab;--line:#2d3140;
  --fuki:#8aa2f2;--hiki:#5cc3a6;--uchi:#f06d4f;--kin:#d9b45c;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 28px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px;border-radius:10px}

.app{max-width:1120px;margin:0 auto;display:grid;gap:18px}
header{display:flex;align-items:center;gap:12px}
.ttl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.ttl h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:.08em;margin:0;line-height:1.1}
.ttl .sub{font-size:13px;color:var(--muted);letter-spacing:.12em}
header .sp{flex:1}
.hbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.hbtn svg{width:16px;height:16px}
.ibtn{width:38px;padding:0;justify-content:center}

.main{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:900px){.main{grid-template-columns:minmax(340px,420px) 1fr;align-items:start}
  .left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}}

/* 左：拍子の輪 */
.left{display:grid;gap:14px;justify-items:center}
.ringwrap{position:relative;width:min(100%,380px);aspect-ratio:1;max-width:100%}
#ring{width:100%;height:100%;display:block}
.center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.center .sec{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,17vw,92px);line-height:1}
.center .rep{font-size:13px;color:var(--muted);letter-spacing:.2em;margin-top:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

.form{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{position:relative;overflow:hidden;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--f-display);font-weight:700;font-size:18px;display:grid;place-items:center}
.chip .fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--kin)}
.chip.on{border-color:var(--kin);color:var(--kin)}
.chip.end{font-size:16px}

.transport{display:flex;align-items:center;gap:14px}
.play{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}
.play:active{transform:scale(.95)}
.play svg{width:24px;height:24px}
.tempo{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.tempo button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.tempo b{color:var(--ink);font-weight:500;min-width:62px;text-align:center}

/* 右：楽器 */
.stage{display:grid;gap:14px}
.row{display:grid;gap:10px}
.rowhead{display:flex;align-items:center;gap:10px}
.rowhead button{display:inline-flex;align-items:baseline;gap:8px;padding:4px 10px 4px 0}
.rowhead .k{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.1em;color:var(--g)}
.rowhead .r{font-size:12px;color:var(--muted)}
.rowhead .solo{font-size:11px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin-left:2px}
.rowhead .solo.act{color:var(--g);border-color:var(--g)}
.rowhead hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.rowhead .allbtn{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:2px 12px;white-space:nowrap}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.tile{--lv:0;position:relative;border-radius:16px;border:1px solid color-mix(in oklab,var(--g) calc(18% + var(--lv)*60%),var(--line));
  background:color-mix(in oklab,var(--g) calc(var(--lv)*22%),var(--surface));box-shadow:var(--shadow);transition:opacity .25s, filter .25s}
.tile .tg{width:100%;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;padding:14px 12px 12px;text-align:left;min-height:92px}
.tile svg.ic{width:38px;height:38px;color:var(--g);opacity:calc(.55 + var(--lv)*.45);transform:scale(calc(1 + var(--lv)*.06))}
.tile .nm{display:grid;line-height:1.2;min-width:0}
.tile .yomi{font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.tile .kan{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.04em}
.tile .role{font-size:11.5px;color:var(--g);margin-top:3px}
.tile .now{position:absolute;right:12px;bottom:10px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--g);opacity:calc(var(--lv)*1.2)}
.tile .inf{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.tile.off{opacity:.42;filter:grayscale(.85)}
.tile.off .role::after{content:"・休み";color:var(--muted)}
@media (max-width:520px){
  .tiles{gap:8px}
  .tile .tg{grid-template-columns:1fr;gap:4px;min-height:0;padding:12px 10px 26px}
  .tile .kan{font-size:21px}
  .tile .yomi{font-size:10px}
  .tile .role{font-size:11px}
  .tile svg.ic{width:30px;height:30px}
  .tile .now{right:10px;bottom:7px;font-size:13px}
}
.hint{font-size:12px;color:var(--muted);text-align:center}

/* シート */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:22px;width:min(560px,calc(100vw - 24px));max-height:min(86vh,760px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,12,18,.45)}
@media (max-width:620px){dialog{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:22px 22px 0 0;max-height:88vh}}
.sh{padding:22px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;overflow:auto;max-height:inherit}
.shtop{display:flex;align-items:flex-start;gap:12px}
.shtop h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.06em;line-height:1.15}
.shtop .yomi{font-size:12px;color:var(--muted);letter-spacing:.1em}
.shtop .sp{flex:1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.lead{margin:0;font-size:15px;max-width:60ch}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:1px 9px;border:1px solid var(--g);color:var(--g)}
.pads{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
.pad{border-radius:14px;border:1px solid var(--line);background:var(--bg);min-height:64px;display:grid;place-content:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}
.pad b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.pad small{font-size:10.5px;color:var(--muted)}
.pad.wide{grid-column:span 2}
.pad.hit,.pad:active{background:color-mix(in oklab,var(--g) 22%,var(--bg));border-color:var(--g)}
.padlabel{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:-6px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
summary::before{content:"＋ ";color:var(--kin)}
details[open] summary::before{content:"－ "}
details p{margin:.6em 0 0;font-size:14px;max-width:62ch}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sw .t{display:grid}
.sw .t small{color:var(--muted);font-size:12px}
.tog{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog[aria-checked="true"]{background:var(--kin)}
.tog[aria-checked="true"]::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--kin)}

/* しくみ */
.learn{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.card>button.h{width:100%;display:flex;align-items:center;gap:12px;padding:14px;text-align:left}
.card .n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--kin);width:22px;flex:none}
.card .q{font-weight:700;font-size:15.5px;flex:1}
.card .chev{color:var(--muted);transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.card .b{display:none;padding:0 14px 14px 48px}
.card.open .b{display:grid;gap:10px}
.card .b p{margin:0;font-size:14px;max-width:60ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500}
.act svg{width:12px;height:12px}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--kin);padding-left:10px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="ttl">
      <h1>越天楽</h1>
      <span class="sub">平調・早四拍子</span>
    </div>
    <span class="sp"></span>
    <button class="hbtn" id="learnBtn" aria-label="雅楽のしくみ"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5h4.5a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 0-1.5-1.5H2zM14 3.5H9.5A1.5 1.5 0 0 0 8 5v8.5a1.5 1.5 0 0 1 1.5-1.5H14z"/></svg>しくみ</button>
    <button class="hbtn ibtn" id="setBtn" aria-label="設定"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h8M13 4h1M2 8h2M7 8h7M2 12h6M11 12h3"/><circle cx="11.5" cy="4" r="1.5"/><circle cx="5.5" cy="8" r="1.5"/><circle cx="9.5" cy="12" r="1.5"/></svg></button>
  </header>

  <div class="main">
    <section class="left" aria-label="拍子と進行">
      <div class="ringwrap">
        <canvas id="ring" aria-label="早四拍子の輪"></canvas>
        <div class="center"><div class="sec" id="secL">A</div><div class="rep" id="repL">はじめから</div></div>
      </div>
      <div class="legend"><span><i style="background:var(--uchi)"></i>太鼓</span><span><i style="background:var(--kin)"></i>鉦鼓</span><span><i style="background:var(--ink);border-radius:2px;height:3px;width:12px;vertical-align:3px"></i>鞨鼓</span></div>
      <div class="form" id="form"></div>
      <div class="transport">
        <div class="tempo"><button id="tDown" aria-label="遅く">−</button><b id="tVal">♩=56</b><button id="tUp" aria-label="速く">＋</button></div>
        <button class="play" id="play" aria-label="再生"><svg viewBox="0 0 24 24" fill="currentColor" id="playIc"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <button class="hbtn ibtn" id="songInfo" aria-label="この曲について" style="font-family:var(--f-display);font-weight:700">i</button>
      </div>
    </section>

    <section class="stage" id="stage" aria-label="楽器"></section>
  </div>
  <p class="hint">楽器をタップすると、休ませたり戻したりできます</p>
</div>

<dialog id="dlg"><div class="sh" id="dlgBody"></div></dialog>

<script>
(()=>{
'use strict';
/* ============================================================
   1. 曲のデータ（越天楽・平調）
   ------------------------------------------------------------
   ・形式：A A B B C C（各8小拍子＝4拍×8）＋ 留手
   ・笙の合竹：構成音は日本語版ウィキペディア「笙」の表による
   ・旋律（篳篥）：★仮入力。楽譜と照合して差し替える前提
   ============================================================ */
const BPM_DEFAULT = 56;
const SEC_BEATS = 32;
// 音名→MIDI（A4=430Hzで発音）
const N = {D4:62,E4:64,'F#4':66,G4:67,A4:69,B4:71,'C#5':73,D5:74,E5:76,'F#5':78};
const X = [['A4',2],['F#4',1],['E4',1],['D4',1],['E4',3]];             // 各段を結ぶ共通の終止句
const MELODY = {
  A: [['E4',2],['F#4',2],['B4',4], ...X, ['A4',2],['B4',2],['C#5',2],['B4',1],['A4',1], ...X],
  B: [['B4',2],['C#5',2],['E5',4],['D5',1],['C#5',1],['B4',2],['A4',4],['F#4',2],['A4',2],['B4',2],['A4',1],['F#4',1], ...X],
  C: [['E5',4],['F#5',2],['E5',1],['D5',1],['C#5',2],['B4',2],['A4',4],['B4',2],['A4',2],['F#4',2],['A4',1],['F#4',1],['E4',2],['D4',1],['E4',1],['E4',4]],
};
const FORM = ['A','A','B','B','C','C'];
const END_BEATS = 8;
const TOTAL = FORM.length*SEC_BEATS + END_BEATS;

// 笙の合竹（11種）
const AITAKE = {
  '乞':[69,76,81,83,88,90], '一':[71,74,76,81,83,90], '工':[73,74,76,80,81,83],
  '凢':[74,76,81,83,88,90], '乙':[76,81,83,86,88,90], '下':[78,80,81,83,86,90],
  '十':[78,79,81,83,86,88], '美':[80,81,83,84,86,90], '行':[81,83,86,88,90],
  '比':[81,83,84,86,88,90], '十(双)':[79,81,83,86,88],
};
const AITAKE_ROOT = {'乞':9,'一':11,'工':1,'凢':2,'乙':4,'下':6,'十':7,'美':8,'行':9,'比':0,'十(双)':7};
const PC_TO_AITAKE = {4:'乙',6:'下',7:'十',9:'乞',11:'一',1:'工',2:'凢',0:'比',8:'美'};
const RITSU = {2:'壱越',3:'断金',4:'平調',5:'勝絶',6:'下無',7:'双調',8:'鳧鐘',9:'黄鐘',10:'鸞鏡',11:'盤渉',0:'神仙',1:'上無'};
const WEST = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const SCALE_PC = [4,6,7,9,11,1,2];
const f0 = m => 430*Math.pow(2,(m-69)/12);
const pc = m => ((m%12)+12)%12;
function scaleUp(m){ for(let k=1;k<4;k++){ if(SCALE_PC.includes(pc(m+k))) return m+k; } return m+2; }
function inRange(m,lo){ let x=lo+((pc(m)-pc(lo)+12)%12); return x; }

// 打物（早四拍子：4小拍子＝16拍でひとめぐり）
const PERC = [
  {inst:'kakko',off:0, k:'katarai'},{inst:'kakko',off:4,k:'katarai'},{inst:'kakko',off:8,k:'sei'},
  {inst:'kakko',off:10,k:'morobai'},{inst:'kakko',off:12,k:'sei'},
  {inst:'shoko',off:0,k:'chin'},{inst:'shoko',off:4,k:'chin'},{inst:'shoko',off:8,k:'chi'},{inst:'shoko',off:8.5,k:'chin'},{inst:'shoko',off:12,k:'chin'},
  {inst:'taiko',off:8,k:'zu'},{inst:'taiko',off:12,k:'do'},
];

function buildScore(){
  const ev = [];
  FORM.forEach((s,si)=>{
    const base = si*SEC_BEATS; const mel = MELODY[s];
    let pos=0; const notes=[];
    mel.forEach(([n,d],i)=>{ notes.push({beat:base+pos,dur:d,midi:N[n]}); pos+=d; });
    const at = b => { let p=0; for(const [n,d] of mel){ if(b<p+d) return N[n]; p+=d;} return N[mel[mel.length-1][0]]; };
    notes.forEach((nt,i)=>{
      const prev = notes[i-1];
      const enbai = nt.dur>=2 || (prev && nt.midi>prev.midi);
      ev.push({inst:'hichiriki',beat:nt.beat,dur:nt.dur,midi:nt.midi,enbai});
      const rm = nt.midi+12;
      ev.push({inst:'ryuteki',beat:nt.beat,dur:nt.dur,midi:rm,grace: nt.dur>=2 ? scaleUp(rm) : 0});
    });
    let last=null;
    for(let m=0;m<8;m++) for(const h of [0,2]){
      const name = PC_TO_AITAKE[pc(at(m*4+h))] || '乙';
      if(name!==last){ ev.push({inst:'sho',beat:base+m*4+h,chord:name}); last=name; }
    }
    for(let m=0;m<8;m++){
      const b = base+m*4;
      let t = inRange(at(m*4),52); if(t===52) t=64;
      ev.push({inst:'biwa',beat:b,midi:t,arp:[40,47,52,t]});
      ev.push({inst:'koto',beat:b,k:'shizu',midi:inRange(at(m*4),62)});
      ev.push({inst:'koto',beat:b+2,k:'haya',midi:inRange(at(m*4+2),62)});
    }
  });
  for(let c=0;c<FORM.length*SEC_BEATS/16;c++) PERC.forEach(p=>ev.push({inst:p.inst,beat:c*16+p.off,k:p.k}));
  const e0 = FORM.length*SEC_BEATS;
  ev.push({inst:'biwa',beat:e0,midi:64,arp:[40,47,52,64]});
  ev.push({inst:'koto',beat:e0,k:'shizu',midi:64});
  ev.push({inst:'biwa',beat:e0+4,midi:52,arp:[40,47,52],final:true});
  ev.push({inst:'koto',beat:e0+4,k:'tome',midi:64});
  // 管のつながり（タイ）
  ['hichiriki','ryuteki'].forEach(id=>{
    const l = ev.filter(e=>e.inst===id).sort((a,b)=>a.beat-b.beat);
    l.forEach((e,i)=>{ const nx=l[i+1]; e.tie = !!nx && Math.abs(nx.beat-(e.beat+e.dur))<1e-6; });
  });

let ctx=null, master, fx, padBus, inst={}, noiseBuf, shoWave;
function initAudio(){
  if(ctx) return;
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3; comp.attack.value=.01; comp.release.value=.3;
  master = ctx.createGain(); master.gain.value=.9; master.connect(comp); comp.connect(ctx.destination);
  // 残響（寝殿のような木の空間をイメージ）
  const len = ctx.sampleRate*2.6, ir = ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); let lp=0; for(let i=0;i<len;i++){ const r=Math.random()*2-1; lp+= .35*(r-lp); d[i]=lp*Math.pow(1-i/len,3.2)*(i<ctx.sampleRate*.012?i/(ctx.sampleRate*.012):1); } }
  const conv = ctx.createConvolver(); conv.buffer=ir;
  const wet = ctx.createGain(); wet.gain.value=.34; conv.connect(wet); wet.connect(master);
  fx = ctx.createGain(); fx.connect(master); fx.connect(conv);
  padBus = ctx.createGain(); padBus.gain.value=1; padBus.connect(fx);
  const LEVEL = {sho:.5,hichiriki:.42,ryuteki:.3,biwa:.55,koto:.42,kakko:.5,taiko:.95,shoko:.32};
  Object.keys(INST).forEach(id=>{ const g=ctx.createGain(); g.gain.value = state.on[id]?LEVEL[id]:0; g.connect(fx); inst[id]={g,level:LEVEL[id]}; });
  noiseBuf = ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); { const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  // 笙の音色（自由簧の倍音）
  const H=24, re=new Float32Array(H), im=new Float32Array(H);
  for(let n=1;n<H;n++){ im[n] = Math.pow(n,-1.05)*(n%2?1:.72)*(n>9?.6:1); }
  shoWave = ctx.createPeriodicWave(re,im);
}
function setMuteGain(id,on){ if(!ctx) return; const g=inst[id].g.gain; g.cancelScheduledValues(ctx.currentTime); g.setTargetAtTime(on?inst[id].level:0,ctx.currentTime,.06); }

// 管（篳篥・龍笛）：一本の息でつながる単旋律の声
class Wind{
  constructor(kind,out){
    this.kind=kind; this.params=[]; this.srcs=[];
    const env = this.env = ctx.createGain(); env.gain.value=0;
    if(kind==='hichiriki'){
      const o1=ctx.createOscillator(); o1.type='sawtooth';
      const o2=ctx.createOscillator(); o2.type='square'; o2.detune.value=6;
      const m2=ctx.createGain(); m2.gain.value=.35;
      const sh=ctx.createWaveShaper(); const c=new Float32Array(1024); for(let i=0;i<1024;i++){const x=i/512-1; c[i]=Math.tanh(x*1.8);} sh.curve=c;
      const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=260;
      const p1=ctx.createBiquadFilter(); p1.type='peaking'; p1.frequency.value=1150; p1.Q.value=1.3; p1.gain.value=9;
      const p2=ctx.createBiquadFilter(); p2.type='peaking'; p2.frequency.value=2700; p2.Q.value=2; p2.gain.value=5;
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4200; lp.Q.value=.5;
      const pre=ctx.createGain(); pre.gain.value=.5;
      o1.connect(pre); o2.connect(m2); m2.connect(pre); pre.connect(sh); sh.connect(hp); hp.connect(p1); p1.connect(p2); p2.connect(lp); lp.connect(env);

      this.params=[[o1.frequency,1],[o2.frequency,1]]; this.srcs=[o1,o2,lfo];
    } else {
      const o1=ctx.createOscillator(); o1.type='sine';
      const o2=ctx.createOscillator(); o2.type='triangle';
      const g2=ctx.createGain(); g2.gain.value=.12;
      const o3=ctx.createOscillator(); o3.type='sine'; const g3=ctx.createGain(); g3.gain.value=.05;
      const nz=ctx.createBufferSource(); nz.buffer=noiseBuf; nz.loop=true;
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=6; const ng=ctx.createGain(); ng.gain.value=.55;
      const air=ctx.createBiquadFilter(); air.type='highpass'; air.frequency.value=3000; const ag=ctx.createGain(); ag.gain.value=.025;
      o1.connect(env); o2.connect(g2); g2.connect(env); o3.connect(g3); g3.connect(env);
      nz.connect(bp); bp.connect(ng); ng.connect(env); nz.connect(air); air.connect(ag); ag.connect(env);
      const lfo=ctx.createOscillator(); lfo.frequency.value=5.2; const lg=ctx.createGain(); lg.gain.value=5; lfo.connect(lg); lg.connect(o1.detune); lg.connect(o2.detune);
      this.params=[[o1.frequency,1],[o2.frequency,2],[o3.frequency,3],[bp.frequency,1]]; this.srcs=[o1,o2,o3,nz,lfo];
    }
    env.connect(out);
    const t=ctx.currentTime; this.srcs.forEach(s=>s.start(t));
    this.lastEnd=-9;
  }
  jump(f,t){ this.params.forEach(([p,r])=>p.setValueAtTime(f*r,t)); }
  glide(f,t,tc){ this.params.forEach(([p,r])=>p.setTargetAtTime(f*r,t,tc)); }
  note(t,d,f,o={}){
    const g=this.env.gain, H=this.kind==='hichiriki';
    const fresh = t-this.lastEnd>0.03;
    if(fresh){ this.jump(o.enbai?f*0.93:f,t); g.setTargetAtTime(H?.5:.45,t,.05); }
    else if(H){ g.setTargetAtTime(.42,t-.03,.012); g.setTargetAtTime(.75,t+.04,.05); if(o.enbai) this.glide(f*0.955,t-.02,.015); }
    else { g.setTargetAtTime(.55,t-.02,.02); }
    if(o.grace){ this.glide(f0(o.grace),t,.01); this.glide(f,t+Math.min(.16,d*.2),.025); }
    else this.glide(f,t+(o.enbai?.05:0),o.enbai?(H?.13:.06):.03);
    g.setTargetAtTime(1,t+.18,Math.max(.12,d*.32));
    if(!o.tie) g.setTargetAtTime(0,t+d-.07,.05);
    this.lastEnd=t+d;
  }
  hold(f,enbai){ const t=ctx.currentTime, g=this.env.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
    this.params.forEach(([p])=>{p.cancelScheduledValues(t);}); this.jump(enbai?f*0.92:f,t); this.glide(f,t+.05,enbai?.18:.03);
    g.setTargetAtTime(.5,t,.04); g.setTargetAtTime(1,t+.15,.35); }
  release(){ const t=ctx.currentTime,g=this.env.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.setTargetAtTime(0,t,.06); }
  kill(t){ this.env.gain.cancelScheduledValues(t); this.env.gain.setTargetAtTime(0,t,.05); this.srcs.forEach(s=>{try{s.stop(t+.5)}catch(e){}}); }
}

// 笙：竹ごとの声を持ち、手移りで共通の竹は鳴らしたまま
class Sho{
  constructor(out){ this.out=out; this.bus=ctx.createGain(); this.bus.gain.value=.9;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4200; this.bus.connect(lp); lp.connect(out); this.v=new Map(); }
  chord(t,midis,stagger=.045){
    const nx=new Set(midis); let i=0;
    for(const [m,v] of [...this.v]){ if(!nx.has(m)){ const tt=t+(i++)*stagger; v.g.gain.setTargetAtTime(0,tt,.05); v.o.stop(tt+.8); this.v.delete(m);} }
    let j=0;
    for(const m of midis){ if(this.v.has(m)) continue;
      const o=ctx.createOscillator(); o.setPeriodicWave(shoWave); o.frequency.value=f0(m); o.detune.value=(Math.random()*6-3);
      const g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(this.bus);
      const tt=t+(j++)*stagger; o.start(tt); g.gain.setTargetAtTime(.11,tt,.07); this.v.set(m,{o,g}); }
    const b=this.bus.gain; b.setTargetAtTime(.72,t,.08); b.setTargetAtTime(1,t+.25,.9);
  }
  off(t){ for(const [m,v] of this.v){ v.g.gain.setTargetAtTime(0,t,.12); v.o.stop(t+1.2);} this.v.clear(); }
}

// 撥弦（琵琶・箏）：Karplus–Strong を事前計算
const ksCache=new Map();
function ks(f,sec,bright,damp){
  const key=f.toFixed(2)+'|'+sec+'|'+bright+'|'+damp; if(ksCache.has(key)) return ksCache.get(key);
  const sr=ctx.sampleRate, n=Math.floor(sr*sec), buf=ctx.createBuffer(1,n,sr), d=buf.getChannelData(0);
  const L=Math.max(2,Math.round(sr/f-.5)), line=new Float32Array(L); let p=0;
  for(let i=0;i<L;i++){ p+=bright*((Math.random()*2-1)-p); line[i]=p; }
  let ix=0, mx=0;
  for(let i=0;i<n;i++){ const a=line[ix], b=line[(ix+1)%L]; line[ix]=damp*.5*(a+b); d[i]=a; ix=(ix+1)%L; if(Math.abs(a)>mx) mx=Math.abs(a); }
  const k=.9/(mx||1), fade=Math.floor(sr*.05); for(let i=0;i<n;i++){ d[i]*=k; if(i>n-fade) d[i]*=(n-i)/fade; }
  ksCache.set(key,buf); return buf;
}
let sawariCurve=null;
function pluck(kind,t,m,vel,out){
  const f=f0(m), src=ctx.createBufferSource(), g=ctx.createGain();
  if(kind==='biwa'){
    src.buffer=ks(f,2.6,.55,.9965);
    if(!sawariCurve){ sawariCurve=new Float32Array(1024); for(let i=0;i<1024;i++){const x=i/512-1; sawariCurve[i]=Math.tanh(x*2.4)+.08*Math.sin(x*9);} }
    const sh=ctx.createWaveShaper(); sh.curve=sawariCurve;
    const pk=ctx.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=1600; pk.Q.value=1.2; pk.gain.value=6;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3800;
    src.connect(sh); sh.connect(pk); pk.connect(lp); lp.connect(g);
    // 撥の当たる音
    const c=ctx.createBufferSource(); c.buffer=noiseBuf; const hp=ctx.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=2400; hp.Q.value=.9;
    const cg=ctx.createGain(); cg.gain.setValueAtTime(.35*vel,t); cg.gain.exponentialRampToValueAtTime(.001,t+.035);
    c.connect(hp); hp.connect(cg); cg.connect(out); c.start(t,Math.random()); c.stop(t+.05);
  } else {
    src.buffer=ks(f,3.2,.75,.9982);
    const pk=ctx.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=2200; pk.Q.value=1; pk.gain.value=3;
    src.connect(pk); pk.connect(g);
  }
  g.gain.value=vel; g.connect(out); src.start(t);
}
function drum(kind,t,k,vel,out){
  if(kind==='taiko'){
    const strong=k==='do', o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.setValueAtTime(strong?118:100,t); o.frequency.exponentialRampToValueAtTime(strong?52:56,t+.28);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime((strong?1:.45)*vel,t+.006); g.gain.exponentialRampToValueAtTime(.001,t+(strong?2.2:1.3));
    o.connect(g); g.connect(out); o.start(t); o.stop(t+2.4);
    const o2=ctx.createOscillator(), g2=ctx.createGain(); o2.frequency.value=strong?176:150; g2.gain.setValueAtTime((strong?.35:.18)*vel,t); g2.gain.exponentialRampToValueAtTime(.001,t+.45);
    o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t+.5);
    const n=ctx.createBufferSource(); n.buffer=noiseBuf; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=strong?520:380;
    const ng=ctx.createGain(); ng.gain.setValueAtTime((strong?.7:.3)*vel,t); ng.gain.exponentialRampToValueAtTime(.001,t+.18);
    n.connect(lp); lp.connect(ng); ng.connect(out); n.start(t,Math.random()); n.stop(t+.2);
  } else if(kind==='kakko'){
    const o=ctx.createOscillator(), g=ctx.createGain(); const base=k==='L'?520:560;
    o.frequency.setValueAtTime(base,t); o.frequency.exponentialRampToValueAtTime(base*.78,t+.06);
    g.gain.setValueAtTime(.55*vel,t); g.gain.exponentialRampToValueAtTime(.001,t+.11); o.connect(g); g.connect(out); o.start(t); o.stop(t+.13);
    const n=ctx.createBufferSource(); n.buffer=noiseBuf; const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=1.6;
    const ng=ctx.createGain(); ng.gain.setValueAtTime(.9*vel,t); ng.gain.exponentialRampToValueAtTime(.001,t+.05);
    n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t,Math.random()); n.stop(t+.07);
  } else { // 鉦鼓
    const soft=k==='chi', base=1640;
    [[1,1,.9],[2.31,.55,.6],[4.07,.3,.35],[6.2,.18,.22],[1.007,.5,.9]].forEach(([r,a,dec])=>{
      const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=base*r;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a*vel*(soft?.45:1),t+.002); g.gain.exponentialRampToValueAtTime(.0008,t+dec*(soft?.6:1));
      o.connect(g); g.connect(out); o.start(t); o.stop(t+dec+.05); });
    const n=ctx.createBufferSource(); n.buffer=noiseBuf; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5000;
    const ng=ctx.createGain(); ng.gain.setValueAtTime(.25*vel,t); ng.gain.exponentialRampToValueAtTime(.001,t+.03); n.connect(hp); hp.connect(ng); ng.connect(out); n.start(t,Math.random()); n.stop(t+.04);
  }
}
// 鞨鼓の奏法
function kakkoStroke(k,t,spb,out,vis){
  const hits=[];
  if(k==='sei'){ hits.push([t,1,'R']); }
  else if(k==='katarai'){ let iv=spb*.34, tt=t; for(let i=0;i<9 && iv>.035;i++){ hits.push([tt,.45+i*.06,'L']); tt+=iv; iv*=.8; } }
  else { let iv=spb*.3, tt=t, s=0; const end=t+spb*2-.02; while(tt<end){ hits.push([tt,.4+.5*(tt-t)/(spb*2),s++%2?'L':'R']); tt+=iv; iv=Math.max(.045,iv*.86); } }
  hits.forEach(([tt,v,side])=>drum('kakko',tt,side,v,out));
  return hits.length? hits[hits.length-1][0]-t+.12 : .12;
}
function kotoPattern(k,t,m,spb,out){
  if(k==='shizu'){ pluck('koto',t,m,.7,out); pluck('koto',t+spb*.3,scaleUp(m),.55,out); pluck('koto',t+spb*.62,m,.6,out); pluck('koto',t+spb*.62+.012,m+12,.55,out); }
  else if(k==='haya'){ pluck('koto',t-.07,m,.45,out); pluck('koto',t,m+12,.6,out); }
  else { pluck('koto',t,m,.6,out); pluck('koto',t+.01,m+12,.5,out); pluck('koto',t+spb*1.5,m-12+12,.4,out); }
}
function biwaArp(t,arp,out,final){
  const step=final?.16:.075; const n=arp.length;
  arp.forEach((m,i)=>pluck('biwa',t-(n-1-i)*step,m,.55+i*.12,out));
}

Object.keys(INST).forEach(id=>state.on[id]=true);
try{ const s=JSON.parse(localStorage.getItem('gagaku-pref')||'{}'); if(s.bpm) state.bpm=s.bpm; if('yuragi' in s) state.yuragi=s.yuragi; if('ondo' in s) state.ondo=s.ondo; }catch(e){}
function savePref(){ try{ localStorage.setItem('gagaku-pref',JSON.stringify({bpm:state.bpm,yuragi:state.yuragi,ondo:state.ondo})); }catch(e){} }

const byBeat = new Map(); SCORE.forEach(e=>{ const k=Math.floor(e.beat+1e-6); if(!byBeat.has(k)) byBeat.set(k,[]); byBeat.get(k).push(e); });
let perf=null;
function beatDur(k){
  let d=60/state.bpm;
  if(state.yuragi && k%4===1) d*=1.14;              // 2拍目から3拍目へ少し「ためる」
  if(k>=TOTAL-END_BEATS-4) d*=1+.06*(k-(TOTAL-END_BEATS-4)); // 終わりに向けてゆっくり
  return d;
}
function start(fromBeat=0){
  initAudio(); if(ctx.state==='suspended') ctx.resume();
  stop(true);
  const outs={}; Object.keys(INST).forEach(id=>{ const g=ctx.createGain(); g.connect(inst[id].g); outs[id]=g; });
  const t0=ctx.currentTime+.4;
  perf = { outs, from:fromBeat, k:fromBeat, nextT:t0, beatT:[], vis:[], ondo: state.ondo && fromBeat===0,
    wind:{hichiriki:new Wind('hichiriki',outs.hichiriki), ryuteki:new Wind('ryuteki',outs.ryuteki)}, sho:new Sho(outs.sho), endT:null };
  perf.beatT[fromBeat]=t0;
  state.playing=true; updatePlay();
  perf.timer=setInterval(tick,25); tick();
}
function stop(silent){
  if(!perf) return;
  clearInterval(perf.timer); const t=ctx.currentTime;
  Object.values(perf.outs).forEach(g=>{ g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0,t,.08); setTimeout(()=>g.disconnect(),900); });
  perf.wind.hichiriki.kill(t); perf.wind.ryuteki.kill(t); perf.sho.off(t);
  perf=null; state.playing=false; if(!silent) updatePlay();
}
function included(e){
  if(!perf.ondo) return true;
  if(e.inst==='ryuteki') return true;
  if(e.inst==='biwa'||e.inst==='koto') return e.beat>=SEC_BEATS;
  return e.beat>=8;
}
function tick(){
  if(!perf) return;
  const now=ctx.currentTime;
  while(perf.k<TOTAL && perf.nextT<now+.25){
    const k=perf.k, t=perf.nextT, d=beatDur(k), spb=60/state.bpm;
    const tAt = b => t+(b-k)*d;
    const durS = beats => beats*spb*(state.yuragi?1.035:1);
    (byBeat.get(k)||[]).forEach(e=>{
      if(!included(e) || e.beat<perf.from) return;
      const et=tAt(e.beat), o=perf.outs[e.inst];
      try{ switch(e.inst){
        case 'hichiriki': case 'ryuteki': {
          const ds=durS(e.dur); perf.wind[e.inst].note(et,ds,f0(e.midi),{enbai:e.enbai,grace:e.grace,tie:e.tie});
          perf.vis.push({i:e.inst,t0:et,t1:et+ds,l:RITSU[pc(e.midi)]}); break; }
        case 'sho': {
          const nx = SCORE.find(x=>x.inst==='sho'&&x.beat>e.beat); const endB = nx? nx.beat : FORM.length*SEC_BEATS;
          perf.sho.chord(et-spb*.12,AITAKE[e.chord]);
          if(!nx || endB>=FORM.length*SEC_BEATS){ perf.sho.off(tAt(k)+durS(endB-e.beat)); }
          perf.vis.push({i:'sho',t0:et,t1:et+durS(endB-e.beat),l:e.chord}); break; }
        case 'biwa': biwaArp(et,e.arp,o,e.final); perf.vis.push({i:'biwa',t0:et,t1:et+.6,l:RITSU[pc(e.midi)]}); break;
        case 'koto': kotoPattern(e.k,et,e.midi,spb,o); perf.vis.push({i:'koto',t0:et,t1:et+.55,l:{shizu:'閑掻',haya:'早掻',tome:'留'}[e.k]}); break;
        case 'kakko': { const len=kakkoStroke(e.k,et,spb,o); perf.vis.push({i:'kakko',t0:et,t1:et+len,l:{sei:'正',katarai:'片来',morobai:'諸来'}[e.k]}); break; }
        case 'taiko': drum('taiko',et,e.k,1,o); perf.vis.push({i:'taiko',t0:et,t1:et+(e.k==='do'?.9:.5),l:e.k==='do'?'百':'図'}); break;
        case 'shoko': drum('shoko',et,e.k,1,o); perf.vis.push({i:'shoko',t0:et,t1:et+.35,l:e.k==='chin'?'チン':'チ'}); break;
      } }catch(err){ console.warn(err); }
    });
    perf.nextT=t+d; perf.k=k+1; perf.beatT[perf.k]=perf.nextT;
  }
  if(perf.k>=TOTAL && perf.endT===null) perf.endT=perf.nextT+2.5;
  if(perf.endT!==null && now>perf.endT){ stop(); }
}

/* 拍子の輪 */
const cv=$('#ring'), cx2=cv.getContext('2d'); let css={};
function readCss(){ const s=getComputedStyle(document.documentElement); ['--ink','--muted','--line','--uchi','--kin','--surface','--fuki','--hiki'].forEach(k=>css[k]=s.getPropertyValue(k).trim()); }
readCss(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCss);
new MutationObserver(readCss).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function sizeRing(){ const r=cv.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1); cv.width=r.width*dpr; cv.height=r.height*dpr; cx2.setTransform(dpr,0,0,dpr,0,0); }
new ResizeObserver(sizeRing).observe(cv); sizeRing();
const KAN=['一','二','三','四'];
function drawRing(pos){
  const W=cv.clientWidth, c=W/2, R=W*.42, g=cx2; g.clearRect(0,0,W,W);
  const ang=b=>-Math.PI/2+(b/16)*Math.PI*2;
  const cyc = pos===null? -1 : ((pos%16)+16)%16;
  const sec = pos===null? 0 : Math.floor(Math.max(0,pos)/16);
  // 4つの小拍子
  for(let q=0;q<4;q++){
    const a0=ang(q*4)+.04, a1=ang(q*4+4)-.04, act = cyc>=q*4 && cyc<q*4+4;
    g.beginPath(); g.arc(c,c,R,a0,a1); g.lineWidth=act?5:2; g.strokeStyle=act?css['--ink']:css['--line']; g.lineCap='round'; g.stroke();
    const am=ang(q*4+2), lr=R+W*.06; g.fillStyle=act?css['--ink']:css['--muted']; g.font=`700 ${Math.round(W*.045)}px "Shippori Mincho B1",serif`; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(KAN[q],c+Math.cos(am)*lr,c+Math.sin(am)*lr);
    for(let b=1;b<4;b++){ const a=ang(q*4+b); g.beginPath(); g.moveTo(c+Math.cos(a)*(R-4),c+Math.sin(a)*(R-4)); g.lineTo(c+Math.cos(a)*(R+4),c+Math.sin(a)*(R+4)); g.lineWidth=1.2; g.strokeStyle=css['--line']; g.stroke(); }
  }
  const flash=(off,len)=> cyc>=0 && cyc>=off && cyc<off+len ? 1-(cyc-off)/len : 0;
  // 鞨鼓（内側の帯）
  const rk=R-W*.075;
  PERC.filter(p=>p.inst==='kakko').forEach(p=>{
    const len = p.k==='sei'?.15 : p.k==='katarai'?1.3:2;
    const f=state.on.kakko? flash(p.off,Math.max(.6,len)) : 0;
    g.beginPath(); g.arc(c,c,rk,ang(p.off),ang(p.off+len)); g.lineWidth=p.k==='sei'?7:3+f*3; g.strokeStyle=css['--ink']; g.globalAlpha=.25+f*.75; g.lineCap='round'; g.stroke(); g.globalAlpha=1;
  });
  // 鉦鼓
  const rs=R-W*.13;
  PERC.filter(p=>p.inst==='shoko').forEach(p=>{ const a=ang(p.off), f=state.on.shoko?flash(p.off,.5):0, r=(p.k==='chi'?3:4.5)+f*4;
    g.beginPath(); g.arc(c+Math.cos(a)*rs,c+Math.sin(a)*rs,r,0,7); g.fillStyle=css['--kin']; g.globalAlpha=.45+f*.55; g.fill(); g.globalAlpha=1; });
  // 太鼓（輪の上）
  PERC.filter(p=>p.inst==='taiko').forEach(p=>{ const a=ang(p.off), f=state.on.taiko?flash(p.off,1):0, big=p.k==='do', r=(big?W*.035:W*.02)*(1+f*.5);
    const x=c+Math.cos(a)*R, y=c+Math.sin(a)*R;
    if(f>0){ g.beginPath(); g.arc(x,y,r+f*W*.05*(big?1.2:.7),0,7); g.fillStyle=css['--uchi']; g.globalAlpha=f*.22; g.fill(); g.globalAlpha=1; }
    g.beginPath(); g.arc(x,y,r,0,7); g.fillStyle=css['--uchi']; g.fill();
    g.fillStyle=css['--surface']; g.font=`800 ${Math.round(r*1.05)}px "Shippori Mincho B1",serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(big?'百':'図',x,y+1);
  });
  // 再生位置
  if(cyc>=0){ const a=ang(cyc); g.beginPath(); g.arc(c+Math.cos(a)*R,c+Math.sin(a)*R,6,0,7); g.fillStyle=css['--ink']; g.fill();
    g.beginPath(); g.arc(c+Math.cos(a)*R,c+Math.sin(a)*R,10,0,7); g.strokeStyle=css['--ink']; g.lineWidth=1.5; g.globalAlpha=.35; g.stroke(); g.globalAlpha=1; }
}

function frame(){
  let pos=null;
  if(perf && ctx){
    const now=ctx.currentTime;
    let k=perf.from; while(perf.beatT[k+1]!==undefined && perf.beatT[k+1]<=now) k++;
    const t0=perf.beatT[k], t1=perf.beatT[k+1];
    pos = now<t0 ? perf.from-.001 : k + (t1? Math.min(1,(now-t0)/(t1-t0)) : 0);
    // 楽器の光
    const lv={}, lab={};
    perf.vis = perf.vis.filter(v=>v.t1>now-1);
    for(const v of perf.vis){ if(now>=v.t0 && now<v.t1+.35){ const x = now<v.t1 ? (['hichiriki','ryuteki','sho'].includes(v.i)? .85 : 1-(now-v.t0)/(v.t1-v.t0)*.6) : (1-(now-v.t1)/.35)*.3; if(!(lv[v.i]>x)){ lv[v.i]=x; lab[v.i]=v.l; } } }
    Object.keys(tiles).forEach(id=>{ const x=state.on[id]?(lv[id]||0):0; tiles[id].el.style.setProperty('--lv',x.toFixed(3)); if(lab[id]) tiles[id].now.textContent=lab[id]; });
    // 段の表示
    const b=Math.max(0,pos), si=Math.floor(b/SEC_BEATS);
    if(si<FORM.length){ const s=FORM[si]; $('#secL').textContent=s; const nth=FORM.slice(0,si+1).filter(x=>x===s).length; $('#repL').textContent=(perf.ondo && b<8)?'音頭':(nth===1?'一返':'二返'); }
    else { $('#secL').textContent='留'; $('#repL').textContent='留手'; }
    chips.forEach((c,i)=>{ const on=i===Math.min(si,FORM.length); c.classList.toggle('on',on); c.querySelector('.fill').style.width = i<si? '100%' : on? (i<FORM.length? ((b-si*SEC_BEATS)/SEC_BEATS*100) : Math.min(100,(b-FORM.length*SEC_BEATS)/END_BEATS*100))+'%' : '0'; });
  } else {
    Object.keys(tiles).forEach(id=>tiles[id].el.style.setProperty('--lv','0'));
  }
  drawRing(pos!==null && pos<FORM.length*SEC_BEATS ? pos : null);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

let padWinds={}, padSho=null;
function padStopAll(){ Object.values(padWinds).forEach(w=>w.release()); if(padSho){ padSho.off(ctx.currentTime); } }
function hold(el,on,off){
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); if(ctx.state==='suspended') ctx.resume(); el.setPointerCapture(e.pointerId); el.classList.add('hit'); on(); });
  const end=()=>{ if(!el.classList.contains('hit')) return; el.classList.remove('hit'); off&&off(); };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); el.addEventListener('lostpointercapture',end);
}
function tap(el,fn){ el.addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); if(ctx.state==='suspended') ctx.resume(); el.classList.add('hit'); fn(); setTimeout(()=>el.classList.remove('hit'),140); }); }

function openInst(id){
  const I=INST[id], G=INST_GROUP[id];
  let pads='', label='';
  const notes=[64,66,69,71,73,74,76];
  if(id==='sho'){ label='合竹を押さえて鳴らす'; pads=Object.keys(AITAKE).map(n=>`<button class="pad" data-a="${n}"><b>${n.replace('(双)','')}</b><small>${n.includes('双')?'双調の曲用':RITSU[AITAKE_ROOT[n]]}</small></button>`).join(''); }
  else if(id==='hichiriki'||id==='ryuteki'){ label='押さえて吹く'; pads=notes.map(m=>`<button class="pad" data-m="${id==='ryuteki'?m+12:m}"><b>${WEST[pc(m)]}</b><small>${RITSU[pc(m)]}</small></button>`).join(''); }
  else if(id==='biwa'){ label='撥でかき鳴らす'; pads=notes.map(m=>{ let t=inRange(m,52); if(t===52) t=64; return `<button class="pad" data-m="${t}"><b>${WEST[pc(m)]}</b><small>${RITSU[pc(m)]}</small></button>`;}).join(''); }
  else if(id==='koto'){ label='型で弾く'; pads=`<button class="pad wide" data-k="shizu"><b>閑掻</b><small>しずがき</small></button><button class="pad wide" data-k="haya"><b>早掻</b><small>はやがき</small></button>`; }
  else if(id==='kakko'){ label='打ってみる'; pads=`<button class="pad" data-k="sei"><b>正</b><small>せい</small></button><button class="pad wide" data-k="katarai"><b>片来</b><small>かたらい</small></button><button class="pad wide" data-k="morobai"><b>諸来</b><small>もろらい</small></button>`; }
  else if(id==='taiko'){ label='打ってみる'; pads=`<button class="pad wide" data-k="zu"><b>図</b><small>ズン・左</small></button><button class="pad wide" data-k="do"><b>百</b><small>ドウ・右</small></button>`; }
  else { label='打ってみる'; pads=`<button class="pad wide" data-k="chi"><b>チ</b><small>左</small></button><button class="pad wide" data-k="chin"><b>チン</b><small>右</small></button>`; }
  const enb = id==='hichiriki' ? `<div class="sw"><div class="t"><span>塩梅</span><small>音を下からすくい上げる</small></div><button class="tog" id="enbT" role="switch" aria-checked="true" aria-label="塩梅"></button></div>` : '';
  openSheet(`${top(I.k,I.y,`<div style="margin-top:6px"><span class="tag">${G.k}・${I.role}</span></div>`)}
    <p class="lead">${I.lead}</p>
    <div class="padlabel">${label}</div><div class="pads">${pads}</div>${enb}
    ${I.more.map(([h,t])=>`<details><summary>${h}</summary><p>${t}</p></details>`).join('')}`, G.color);
  const out=padBus, spb=60/state.bpm;
  if(id==='hichiriki'){ const t=$('#enbT'); t.onclick=()=>t.setAttribute('aria-checked', t.getAttribute('aria-checked')!=='true'); }
  body.querySelectorAll('.pad').forEach(p=>{
    if(id==='sho') hold(p,()=>{ if(!padSho) padSho=new Sho(out); padSho.chord(ctx.currentTime,AITAKE[p.dataset.a],.035); },()=>padSho.off(ctx.currentTime));
    else if(id==='hichiriki'||id==='ryuteki') hold(p,()=>{ if(!padWinds[id]) padWinds[id]=new Wind(id,out); const enb = id==='hichiriki' ? $('#enbT').getAttribute('aria-checked')==='true' : false; padWinds[id].hold(f0(+p.dataset.m),enb); },()=>padWinds[id].release());
    else if(id==='biwa') tap(p,()=>biwaArp(ctx.currentTime+.25,[40,47,52,+p.dataset.m],out));
    else if(id==='koto') tap(p,()=>kotoPattern(p.dataset.k,ctx.currentTime+.08,69,spb,out));
    else if(id==='kakko') tap(p,()=>kakkoStroke(p.dataset.k,ctx.currentTime+.02,spb,out));
    else tap(p,()=>drum(id,ctx.currentTime+.01,p.dataset.k,1,out));
  });
}

  {q:'笙の和音「合竹」', p:'笙は5〜6音を同時に鳴らす和音で全体を包みます。旋律の音が変わると、指を一本ずつ移して次の和音へ。響きが途切れないのはこのためです。',
    a:[['笙だけ',()=>playWith(['sho'],SEC_BEATS)],['笙＋篳篥',()=>playWith(['sho','hichiriki'],SEC_BEATS)]]},
  {q:'早四拍子（はやよひょうし）', p:'4つの小拍子でひとめぐり。左の輪の三つ目で太鼓が小さく「図」、四つ目で大きく「百」。鞨鼓の「来」がそこへ向かって速くなり、区切りを予告します。',
    a:[['打物だけで聴く',()=>playWith(['kakko','taiko','shoko'],SEC_BEATS)]]},
  {q:'A A B B C C の形', p:'越天楽は3つの旋律A・B・Cを、それぞれ二回ずつくり返します。AとBは同じ終わり方（共通の終止句）で結ばれます。下の文字をタップすると、その段から聴けます。',
    a:[['Bから',()=>{only(Object.keys(INST));start(SEC_BEATS*2);}],['Cから',()=>{only(Object.keys(INST));start(SEC_BEATS*4);}]]},
  {q:'始まり方と終わり方', p:'始めは龍笛がひとりで吹き出す「音頭」。合図の場所（付所）で笙・篳篥・打物が入り、次の段から琵琶と箏が加わります。最後は管と打物が止み、琵琶と箏だけの「留手」で結びます。',
    a:[['最初から',()=>{only(Object.keys(INST));state.ondo=true;savePref();start(0);}],['終わりを聴く',()=>{only(Object.keys(INST));start(SEC_BEATS*5+16);}]]},
  {q:'拍は等間隔ではない', p:'雅楽の拍は、息に合わせて伸び縮みします。2拍目から3拍目へ移るところで少し「ためる」のが特徴。設定の「ゆらぎ」で違いを比べられます。',
    a:[['ゆらぎあり',()=>{state.yuragi=true;savePref();only(Object.keys(INST));start(SEC_BEATS);}],['ゆらぎなし',()=>{state.yuragi=false;savePref();only(Object.keys(INST));start(SEC_BEATS);}]]},
];
function playWith(list,from=0){ only(list); start(from); dlg.close(); }
$('#learnBtn').onclick=()=>{
  openSheet(`${top('雅楽のしくみ','ががく')}<div class="learn">${LEARN.map((l,i)=>`<div class="card"><button class="h" aria-expanded="false"><span class="n">${KAN[i]||['五','六','七'][i-4]}</span><span class="q">${l.q}</span><span class="chev">›</span></button><div class="b"><p>${l.p}</p><div class="acts">${l.a.map((a,j)=>`<button class="act" data-i="${i}" data-j="${j}">${PLAYI}${a[0]}</button>`).join('')}</div></div></div>`).join('')}</div>`);
  body.querySelectorAll('.card .h').forEach(h=>h.onclick=()=>{ const c=h.parentElement, o=!c.classList.contains('open'); c.classList.toggle('open',o); h.setAttribute('aria-expanded',o); });
  body.querySelectorAll('.act').forEach(b=>b.onclick=()=>{ LEARN[+b.dataset.i].a[+b.dataset.j][1](); dlg.close(); });
  body.querySelector('.card').classList.add('open');
};
$('#setBtn').onclick=()=>{
  openSheet(`${top('設定','せってい')}
    <div class="sw" style="border-top:0;display:grid;gap:4px"><div class="t"><span>テンポ　♩=<b id="bpmV">${state.bpm}</b></span><small>実際の演奏は 50〜60 くらい</small></div><input type="range" id="bpmR" min="36" max="90" step="1" value="${state.bpm}" aria-label="テンポ"></div>
    <div class="sw"><div class="t"><span>ゆらぎ</span><small>2拍目から3拍目へ少しためる</small></div><button class="tog" id="yT" role="switch" aria-checked="${state.yuragi}" aria-label="ゆらぎ"></button></div>
    <div class="sw"><div class="t"><span>音頭から始める</span><small>龍笛のひとり吹きから、楽器が順に加わる</small></div><button class="tog" id="oT" role="switch" aria-checked="${state.ondo}" aria-label="音頭から始める"></button></div>`);
  $('#bpmR').oninput=e=>setBpm(+e.target.value);
  $('#yT').onclick=e=>{ state.yuragi=!state.yuragi; e.currentTarget.setAttribute('aria-checked',state.yuragi); savePref(); };
  $('#oT').onclick=e=>{ state.ondo=!state.ondo; e.currentTarget.setAttribute('aria-checked',state.ondo); savePref(); };
};
$('#songInfo').onclick=()=>{
  openSheet(`${top('越天楽','えてんらく')}
    <p class="lead">雅楽でいちばんよく知られた曲。舞をともなわない「管絃」として、8つの楽器で演奏されます。</p>
    <details open><summary>平調（ひょうじょう）</summary><p>E（平調の音）を中心にした調子。笙の和音もこの調子の響きでできています。</p></details>
    <details><summary>早四拍子</summary><p>4つの小拍子で太鼓がひとめぐりする拍子。1つの段（A・B・C）は8小拍子です。</p></details>
    <details><summary>今様・黒田節</summary><p>この旋律に歌詞をつけた「越天楽今様」が平安時代に流行し、のちの民謡「黒田節」にもつながりました。</p></details>
    <p class="note">旋律（篳篥・龍笛）の音は現在仮のデータです。楽譜と照合して差し替え予定。笙の合竹の構成音、曲の形式、楽器の役割は資料にもとづいています。</p>`);
};

renderTiles(); updatePlay();
document.addEventListener('visibilitychange',()=>{ if(document.hidden && perf) stop(); });
})();
</script>
</body>
</html>
