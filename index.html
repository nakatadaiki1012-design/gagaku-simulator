<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雅楽 合奏の間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
/* Layout: 3Dの舞台（16人の管絃）を主役に、その下に「拍子の輪」と進行・再生、さらに下に8楽器のスイッチ。 */
:root{
  --bg:#e9ebe6; --surface:#f6f7f3; --ink:#1c2130; --muted:#5b6270; --line:#c7cbc3;
  --fuki:#2c4799; --hiki:#2a7a66; --uchi:#c0412a; --kin:#9c7a2a;
  --sky1:#f4f3ee; --sky2:#d9ddd5;
  --shadow:0 1px 0 rgba(28,33,48,.06),0 6px 20px -12px rgba(28,33,48,.25);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131a;--surface:#1a1d26;--ink:#ebe8df;--muted:#9a9fab;--line:#2d3140;
  --fuki:#8aa2f2;--hiki:#5cc3a6;--uchi:#f06d4f;--kin:#d9b45c;--sky1:#232838;--sky2:#0d0f15;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131a;--surface:#1a1d26;--ink:#ebe8df;--muted:#9a9fab;--line:#2d3140;
  --fuki:#8aa2f2;--hiki:#5cc3a6;--uchi:#f06d4f;--kin:#d9b45c;--sky1:#232838;--sky2:#0d0f15;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 26px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px;border-radius:10px}

.app{max-width:1180px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:center;gap:12px}
.ttl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.ttl h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:.08em;margin:0;line-height:1.1}
.ttl .sub{font-size:13px;color:var(--muted);letter-spacing:.12em}
header .sp{flex:1}
.hbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.hbtn svg{width:16px;height:16px}
.ibtn{width:38px;padding:0;justify-content:center}

/* 3D舞台 */
.stagebox{position:relative;border-radius:22px;overflow:hidden;height:clamp(340px,62vh,640px);
  background:radial-gradient(120% 90% at 50% 10%,var(--sky1),var(--sky2));border:1px solid var(--line);box-shadow:var(--shadow);touch-action:pan-y}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:auto;display:grid;justify-items:center;gap:1px;
  font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1;padding:5px 9px 6px;border-radius:10px;
  background:color-mix(in oklab,var(--surface) 82%,transparent);border:1px solid color-mix(in oklab,var(--g) calc(25% + var(--lv,0)*75%),var(--line));
  color:var(--ink);box-shadow:0 0 calc(var(--lv,0)*18px) color-mix(in oklab,var(--g) 60%,transparent);transition:opacity .25s}
.lb small{font-family:var(--f-body);font-weight:500;font-size:9.5px;color:var(--g);letter-spacing:.06em}
.lb.off{opacity:.45;text-decoration:line-through}
.caption{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;
  font-size:13.5px;font-weight:500;padding:6px 14px;border-radius:16px;background:color-mix(in oklab,var(--ink) 86%,transparent);color:var(--bg);
  opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption.show{opacity:1}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.viewbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.viewbtns button{height:30px;padding:0 11px;border-radius:15px;font-size:12px;background:color-mix(in oklab,var(--surface) 85%,transparent);border:1px solid var(--line)}
.viewbtns button.on{border-color:var(--kin);color:var(--kin)}

/* 操作盤 */
.console{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ringwrap{position:relative;width:150px;aspect-ratio:1;max-width:100%}
#ring{width:100%;height:100%;display:block}
.center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.center .sec{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
.center .rep{font-size:10.5px;color:var(--muted);letter-spacing:.14em;margin-top:3px}
.ctrl{display:grid;gap:12px;justify-items:start;min-width:0}
.form{display:flex;gap:6px;flex-wrap:wrap}
.chip{position:relative;overflow:hidden;min-width:40px;height:40px;padding:0 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--f-display);font-weight:700;font-size:17px;display:grid;place-items:center}
.chip .fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--kin)}
.chip.on{border-color:var(--kin);color:var(--kin)}
.chip.sm{font-size:14px}
.transport{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s;flex:none}
.play:active{transform:scale(.95)}
.play svg{width:22px;height:22px}
.tempo{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.tempo button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.tempo b{color:var(--ink);font-weight:500;min-width:58px;text-align:center}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
@media (max-width:560px){
  .stagebox{height:clamp(270px,44vh,360px)}
  .lb{font-size:13px;padding:4px 7px 5px}
  .lb small{display:none}
  .console{grid-template-columns:96px 1fr;gap:10px}
  .ringwrap{width:96px}
  .center .sec{font-size:26px}
  .center .rep{font-size:9px}
  .chip{min-width:27px;height:34px;font-size:14px;border-radius:9px;padding:0 3px}
  .chip.sm{font-size:12px}
  .form{gap:3px}
  .legend{display:none}
}

/* 楽器スイッチ */
.insts{display:flex;flex-wrap:wrap;gap:10px 18px}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp .gl{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--g);padding:4px 6px 4px 0;display:inline-flex;align-items:baseline;gap:5px}
.grp .gl small{font-family:var(--f-body);font-size:10px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.grp .gl.act small{color:var(--g);border-color:var(--g)}
.ic{--lv:0;display:inline-flex;align-items:stretch;border-radius:12px;border:1px solid color-mix(in oklab,var(--g) calc(25% + var(--lv)*75%),var(--line));
  background:color-mix(in oklab,var(--g) calc(var(--lv)*24%),var(--surface));overflow:hidden;transition:opacity .2s}
.ic .t{display:grid;line-height:1.1;padding:6px 6px 6px 11px;text-align:left}
.ic .t b{font-family:var(--f-display);font-weight:800;font-size:17px}
.ic .t small{font-size:9.5px;color:var(--g)}
.ic .i{width:28px;display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:12px;border-left:1px solid var(--line)}
.ic.off{opacity:.42}
.ic.off .t b{text-decoration:line-through}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0}

/* シート */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:22px;width:min(560px,calc(100vw - 24px));max-height:min(86vh,760px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,12,18,.45)}
@media (max-width:620px){dialog{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:22px 22px 0 0;max-height:88vh}}
.sh{padding:22px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;overflow:auto;max-height:inherit}
.shtop{display:flex;align-items:flex-start;gap:12px}
.shtop h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.06em;line-height:1.15}
.shtop .yomi{font-size:12px;color:var(--muted);letter-spacing:.1em}
.shtop .sp{flex:1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.lead{margin:0;font-size:15px;max-width:60ch}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:1px 9px;border:1px solid var(--g);color:var(--g)}
.pads{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
.pad{border-radius:14px;border:1px solid var(--line);background:var(--bg);min-height:64px;display:grid;place-content:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}
.pad b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.pad small{font-size:10.5px;color:var(--muted)}
.pad.wide{grid-column:span 2}
.pad.hit,.pad:active{background:color-mix(in oklab,var(--g) 22%,var(--bg));border-color:var(--g)}
.padlabel{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:-6px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
summary::before{content:"＋ ";color:var(--kin)}
details[open] summary::before{content:"－ "}
details p{margin:.6em 0 0;font-size:14px;max-width:62ch}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sw .t{display:grid}
.sw .t small{color:var(--muted);font-size:12px}
.tog{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog[aria-checked="true"]{background:var(--kin)}
.tog[aria-checked="true"]::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--kin)}
.learn{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.card>button.h{width:100%;display:flex;align-items:center;gap:12px;padding:14px;text-align:left}
.card .n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--kin);width:22px;flex:none}
.card .q{font-weight:700;font-size:15.5px;flex:1}
.card .chev{color:var(--muted);transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.card .b{display:none;padding:0 14px 14px 48px}
.card.open .b{display:grid;gap:10px}
.card .b p{margin:0;font-size:14px;max-width:60ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500}
.act svg{width:12px;height:12px}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--kin);padding-left:10px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="ttl"><h1>越天楽</h1><span class="sub">平調・早四拍子</span><button class="hbtn ibtn" id="songInfo" aria-label="この曲について" style="font-family:var(--f-display);font-weight:700;width:30px;height:30px;align-self:center">i</button></div>
    <span class="sp"></span>
    <button class="hbtn" id="learnBtn" aria-label="雅楽のしくみ"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5h4.5a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 0-1.5-1.5H2zM14 3.5H9.5A1.5 1.5 0 0 0 8 5v8.5a1.5 1.5 0 0 1 1.5-1.5H14z"/></svg>しくみ</button>
    <button class="hbtn ibtn" id="setBtn" aria-label="設定"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h8M13 4h1M2 8h2M7 8h7M2 12h6M11 12h3"/><circle cx="11.5" cy="4" r="1.5"/><circle cx="5.5" cy="8" r="1.5"/><circle cx="9.5" cy="12" r="1.5"/></svg></button>
  </header>

  <section class="stagebox" id="stagebox" aria-label="3Dの雅楽隊">
    <canvas id="gl"></canvas>
    <div class="labels" id="labels"></div>
    <div class="caption" id="caption"></div>
    <div class="viewbtns"><button data-v="front" class="on">正面</button><button data-v="top">真上</button><button data-v="side">横</button></div>
  </section>

  <section class="console" aria-label="拍子と進行">
    <div class="ringwrap">
      <canvas id="ring" aria-label="早四拍子の輪"></canvas>
      <div class="center"><div class="sec" id="secL">A</div><div class="rep" id="repL">はじめ</div></div>
    </div>
    <div class="ctrl">
      <div class="form" id="form"></div>
      <div class="transport">
        <button class="play" id="play" aria-label="再生"><svg viewBox="0 0 24 24" fill="currentColor" id="playIc"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <div class="tempo"><button id="tDown" aria-label="遅く">−</button><b id="tVal">♩=54</b><button id="tUp" aria-label="速く">＋</button></div>
      </div>
      <div class="legend"><span><i style="background:var(--uchi)"></i>太鼓</span><span><i style="background:var(--kin)"></i>鉦鼓</span><span><i style="background:var(--ink);border-radius:2px;height:3px;width:12px;vertical-align:2px"></i>鞨鼓</span></div>
    </div>
  </section>

  <section class="insts" id="insts" aria-label="楽器のオン・オフ"></section>
  <p class="hint">舞台の奏者か、下の楽器名をタップすると、休ませたり戻したりできます</p>
</div>

<dialog id="dlg"><div class="sh" id="dlgBody"></div></dialog>

<script>
(()=>{
'use strict';
/* ============================================================
   1. 曲のデータ（越天楽・平調）
   ・形式：A A B B C C（各8小拍子＝4拍×8）＋ 留手
   ・笙の合竹の構成音：日本語版ウィキペディア「笙」の表
   ・編成と座り方：文化デジタルライブラリー「音取と奏者の編成」
   ・旋律（篳篥）：★仮入力。楽譜と照合して差し替える前提
   ============================================================ */
const BPM_DEFAULT = 54;
const SEC_BEATS = 32;
const N = {D4:62,E4:64,'F#4':66,G4:67,A4:69,B4:71,'C#5':73,D5:74,E5:76,'F#5':78};
const X = [['A4',2],['F#4',1],['E4',1],['D4',1],['E4',3]];
const MELODY = {
  A: [['E4',2],['F#4',2],['B4',4], ...X, ['A4',2],['B4',2],['C#5',2],['B4',1],['A4',1], ...X],
  B: [['B4',2],['C#5',2],['E5',4],['D5',1],['C#5',1],['B4',2],['A4',4],['F#4',2],['A4',2],['B4',2],['A4',1],['F#4',1], ...X],
  C: [['E5',4],['F#5',2],['E5',1],['D5',1],['C#5',2],['B4',2],['A4',4],['B4',2],['A4',2],['F#4',2],['A4',1],['F#4',1],['E4',2],['D4',1],['E4',1],['E4',4]],
};
const FORM = ['A','A','B','B','C','C'];
const END_BEATS = 8;
const PIECE = FORM.length*SEC_BEATS;
const TOTAL = PIECE + END_BEATS;
const NETORI = -24;

const AITAKE = {
  '乞':[69,76,81,83,88,90], '一':[71,74,76,81,83,90], '工':[73,74,76,80,81,83],
  '凢':[74,76,81,83,88,90], '乙':[76,81,83,86,88,90], '下':[78,80,81,83,86,90],
  '十':[78,79,81,83,86,88], '美':[80,81,83,84,86,90], '行':[81,83,86,88,90],
  '比':[81,83,84,86,88,90], '十(双)':[79,81,83,86,88],
};
const AITAKE_ROOT = {'乞':9,'一':11,'工':1,'凢':2,'乙':4,'下':6,'十':7,'美':8,'行':9,'比':0,'十(双)':7};
const PC_TO_AITAKE = {4:'乙',6:'下',7:'十',9:'乞',11:'一',1:'工',2:'凢',0:'比',8:'美'};
const RITSU = {2:'壱越',3:'断金',4:'平調',5:'勝絶',6:'下無',7:'双調',8:'鳧鐘',9:'黄鐘',10:'鸞鏡',11:'盤渉',0:'神仙',1:'上無'};
const WEST = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const SCALE_PC = [4,6,7,9,11,1,2];
const f0 = m => 430*Math.pow(2,(m-69)/12);
const pc = m => ((m%12)+12)%12;
function scaleUp(m){ for(let k=1;k<4;k++){ if(SCALE_PC.includes(pc(m+k))) return m+k; } return m+2; }
function inRange(m,lo){ return lo+((pc(m)-pc(lo)+12)%12); }

// 打物（早四拍子：4小拍子＝16拍でひとめぐり。太鼓の百で鞨鼓・鉦鼓も同時に打つ）
const PERC = [
  {inst:'kakko',off:0, k:'katarai'},{inst:'kakko',off:4,k:'katarai'},{inst:'kakko',off:8,k:'sei'},
  {inst:'kakko',off:10,k:'morobai'},{inst:'kakko',off:12,k:'sei'},
  {inst:'shoko',off:0,k:'chin'},{inst:'shoko',off:4,k:'chin'},{inst:'shoko',off:8,k:'chi'},{inst:'shoko',off:8.5,k:'chin'},{inst:'shoko',off:12,k:'chin'},
  {inst:'taiko',off:8,k:'zu'},{inst:'taiko',off:12,k:'do'},
];

function buildScore(){
  const ev = [];
  // 音取（簡略）：主管だけが、笙→篳篥→龍笛→鞨鼓→琵琶・箏の順に加わる
  ev.push({inst:'sho',beat:-24,chord:'乙',hold:23});
  ev.push({inst:'hichiriki',beat:-20,dur:5,midi:64,enbai:true},{inst:'hichiriki',beat:-15,dur:1,midi:62},{inst:'hichiriki',beat:-14,dur:5,midi:64,enbai:true});
  ev.push({inst:'ryuteki',beat:-16,dur:4,midi:76,grace:78},{inst:'ryuteki',beat:-12,dur:2,midi:78},{inst:'ryuteki',beat:-10,dur:4,midi:76});
  ev.push({inst:'kakko',beat:-12,k:'katarai'},{inst:'kakko',beat:-9,k:'katarai'},{inst:'kakko',beat:-6,k:'sei'});
  ev.push({inst:'biwa',beat:-8,midi:64,arp:[40,47,52,64]},{inst:'biwa',beat:-5,midi:64,arp:[40,47,52,64]});
  ev.push({inst:'koto',beat:-7,k:'shizu',midi:64},{inst:'koto',beat:-4,k:'tome',midi:64});

  ev.push({inst:'koto',beat:PIECE+4,k:'tome',midi:64});

const state = { on:{}, bpm:BPM_DEFAULT, yuragi:true, ondo:true, playing:false };
Object.keys(INST).forEach(id=>state.on[id]=true);
try{ const s=JSON.parse(localStorage.getItem('gagaku-pref2')||'{}'); if(s.bpm) state.bpm=s.bpm; if('yuragi' in s) state.yuragi=s.yuragi; if('ondo' in s) state.ondo=s.ondo; }catch(e){}
function savePref(){ try{ localStorage.setItem('gagaku-pref2',JSON.stringify({bpm:state.bpm,yuragi:state.yuragi,ondo:state.ondo})); }catch(e){} }

const byBeat = new Map(); SCORE.forEach(e=>{ const k=Math.floor(e.beat+1e-6); if(!byBeat.has(k)) byBeat.set(k,[]); byBeat.get(k).push(e); });
let perf=null;
function beatDur(k){
  let d=60/state.bpm;
  if(k<0) return d*1.3;                                  // 音取は拍のない自由な時間
  d /= (.95 + .09*Math.min(1,k/PIECE));                  // 全体を通して、ごくわずかに速まる
  if(state.yuragi && k%4===1) d*=1.14;                   // 2拍目から3拍目へ少し「ためる」
  if(k>=PIECE-4) d*=1+.06*(k-(PIECE-4));                 // 終わりに向けてゆっくり
  return d;
}
// 誰がいつ加わるか（p=0が首席の「主管」、1・2が「助管」）
function joined(id,p,b){
  if(b<0) return p===0;
  if(!perf.ondo) return true;
  if(id==='ryuteki') return p===0 || b>=16;
  if(id==='sho'||id==='hichiriki') return p===0 ? b>=8 : b>=16;
  if(id==='biwa'||id==='koto') return b>=SEC_BEATS;
  return b>=8;
}
const OFF=[0,.019,-.013], DET=[1,Math.pow(2,7/1200),Math.pow(2,-6/1200)], VG=[1,.72,.66];
function start(fromBeat=0){
  initAudio(); if(ctx.state==='suspended') ctx.resume();
  stop(true);
  const outs={}; Object.keys(INST).forEach(id=>{ const g=ctx.createGain(); g.connect(inst[id].g); outs[id]=g; });
  const t0=ctx.currentTime+.4;
  perf = { outs, from:fromBeat, k:fromBeat, nextT:t0, beatT:{}, vis:[], hits:[], ondo: state.ondo && fromBeat<=0, endT:null,
    wind:{hichiriki:[0,1,2].map(p=>new Wind('hichiriki',outs.hichiriki,VG[p])), ryuteki:[0,1,2].map(p=>new Wind('ryuteki',outs.ryuteki,VG[p]))},
    sho:[0,1,2].map(p=>new Sho(outs.sho,VG[p])) };
  perf.beatT[fromBeat]=t0;
  state.playing=true; updatePlay(); lastPhase=null;
  perf.timer=setInterval(tick,25); tick();
}
function stop(silent){
  if(!perf) return;
  clearInterval(perf.timer); const t=ctx.currentTime;
  Object.values(perf.outs).forEach(g=>{ g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0,t,.08); setTimeout(()=>g.disconnect(),900); });
  perf.wind.hichiriki.forEach(w=>w.kill(t)); perf.wind.ryuteki.forEach(w=>w.kill(t)); perf.sho.forEach(s=>s.off(t));
  perf=null; state.playing=false; if(!silent) updatePlay();
}
function included(e){
  if(e.beat<0) return true;
  if(!perf.ondo) return true;
  if(e.inst==='ryuteki') return true;
  if(e.inst==='biwa'||e.inst==='koto') return e.beat>=SEC_BEATS;
  return e.beat>=8;
}
function hit(i,p,t,s=1){ perf.hits.push({i,p,t,s}); }
function tick(){
  if(!perf) return;
  const now=ctx.currentTime;
  while(perf.k<TOTAL && perf.nextT<now+.25){
    const k=perf.k, t=perf.nextT, d=beatDur(k), spb=60/state.bpm*(k<0?1.3:1);
    const tAt = b => t+(b-k)*d;
    const durS = beats => beats*d*(k>=0&&state.yuragi?1.035:1);
    (byBeat.get(k)||[]).forEach(e=>{
      if(!included(e) || e.beat<perf.from) return;
      const et=tAt(e.beat), o=perf.outs[e.inst];
      try{ switch(e.inst){
        case 'hichiriki': case 'ryuteki': {
          const ds=durS(e.dur), f=f0(e.midi); const ps=[];
          for(let p=0;p<3;p++){ if(!joined(e.inst,p,e.beat)) continue; ps.push(p);
            perf.wind[e.inst][p].note(et+OFF[p],ds,f*DET[p],{enbai:e.enbai,grace:e.grace?e.grace:0,base:e.midi,tie:e.tie}); }
          perf.vis.push({i:e.inst,t0:et,t1:et+ds,l:RITSU[pc(e.midi)],ps}); ps.forEach(p=>hit(e.inst,p,et,.6)); break; }
        case 'sho': {
          const ps=[]; const hold=e.hold? durS(e.hold) : durS(2);
          for(let p=0;p<3;p++){ if(!joined('sho',p,e.beat)) continue; ps.push(p); perf.sho[p].chord(et-spb*.12+OFF[p],e.chord); }
          if(e.hold){ perf.sho.forEach(s=>s.off(et+hold)); }
          if(e.beat===PIECE-2){ perf.sho.forEach(s=>s.off(et+durS(2))); }
          perf.vis.push({i:'sho',t0:et,t1:et+hold,l:e.chord,ps}); break; }
        case 'biwa': { const ps=[0,1].filter(p=>joined('biwa',p,e.beat)); ps.forEach(p=>biwaArp(et+p*.016,e.arp,o,e.final,p?.8:1).forEach(tt=>hit('biwa',p,tt,.5)));
          perf.vis.push({i:'biwa',t0:et,t1:et+.6,l:RITSU[pc(e.midi)],ps}); break; }
        case 'koto': { const ps=[0,1].filter(p=>joined('koto',p,e.beat)); ps.forEach(p=>kotoPattern(e.k,et+p*.014,e.midi,spb,o,p?.8:1).forEach(tt=>hit('koto',p,tt,.5)));
          perf.vis.push({i:'koto',t0:et,t1:et+.55,l:{shizu:'閑掻',haya:'早掻',tome:'留'}[e.k],ps}); break; }
        case 'kakko': { const h=kakkoStroke(e.k,et,spb,o); h.forEach(([tt,v,s])=>hit('kakko',0,tt,v*(s==='R'?1:-1))); const len=h[h.length-1][0]-et+.12;
          perf.vis.push({i:'kakko',t0:et,t1:et+len,l:{sei:'正',katarai:'片来',morobai:'諸来'}[e.k],ps:[0]}); break; }
        case 'taiko': drum('taiko',et,e.k,1,o); hit('taiko',0,et,e.k==='do'?1:-.5); perf.vis.push({i:'taiko',t0:et,t1:et+(e.k==='do'?.9:.5),l:e.k==='do'?'百':'図',ps:[0]}); break;
        case 'shoko': drum('shoko',et,e.k,1,o); hit('shoko',0,et,e.k==='chin'?1:-.6); perf.vis.push({i:'shoko',t0:et,t1:et+.35,l:e.k==='chin'?'チン':'チ',ps:[0]}); break;
      } }catch(err){ console.warn(err); }
    });
    perf.nextT=t+d; perf.k=k+1; perf.beatT[perf.k]=perf.nextT;
  }
  if(perf.k>=TOTAL && perf.endT===null) perf.endT=perf.nextT+2.5;
  if(perf.endT!==null && now>perf.endT){ stop(); }
}

  function tomoeTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');

  }, ripple, players };
}

const form=$('#form'); const chips=[];
const CHIPS=[{s:'音取',b:NETORI,sm:1},...FORM.map((s,i)=>({s,b:i*SEC_BEATS})),{s:'留',b:PIECE-4}];
CHIPS.forEach((c,i)=>{ const el=document.createElement('button'); el.className='chip'+(c.sm?' sm':''); el.innerHTML=`${c.s}<span class="fill"></span>`;
  el.setAttribute('aria-label', c.s==='音取'?'音取（音合わせ）から':c.s==='留'?'留手（終わり）':`${c.s}から`);
  el.onclick=()=>start(c.b); form.appendChild(el); chips.push(el); });

function updatePlay(){ $('#playIc').innerHTML = state.playing ? '<rect x="6" y="5" width="4.5" height="14" rx="1"/><rect x="13.5" y="5" width="4.5" height="14" rx="1"/>' : '<path d="M7 4.5v15l13-7.5z"/>'; $('#play').setAttribute('aria-label',state.playing?'停止':'再生');
  if(!state.playing){ $('#secL').textContent='A'; $('#repL').textContent='はじめ'; chips.forEach(c=>{c.classList.remove('on');c.querySelector('.fill').style.width='0'}); showCaption(''); } }
$('#play').onclick=()=> state.playing? stop() : start(0);
function setBpm(v){ state.bpm=Math.max(36,Math.min(90,v)); $('#tVal').textContent='♩='+state.bpm; savePref(); const r=$('#bpmR'); if(r){ r.value=state.bpm; $('#bpmV').textContent=state.bpm; } }
$('#tDown').onclick=()=>setBpm(state.bpm-4); $('#tUp').onclick=()=>setBpm(state.bpm+4); setBpm(state.bpm);

// 字幕（いま何が起きているか）
let lastPhase=null, capTimer=null;
function showCaption(t){ const c=$('#caption'); if(!t){ c.classList.remove('show'); return; } c.textContent=t; c.classList.add('show'); clearTimeout(capTimer); capTimer=setTimeout(()=>c.classList.remove('show'),5200); }
function phaseOf(b){
  if(b<0){ if(b<-20) return '音取：まず笙が吹き始める'; if(b<-16) return '音取：篳篥が加わる'; if(b<-12) return '音取：龍笛が加わる'; if(b<-8) return '音取：鞨鼓が打ち添える'; return '音取：琵琶と箏で結ぶ'; }
  if(b>=PIECE) return '留手：琵琶と箏だけで曲を結ぶ';
  if(perf.ondo){ if(b<8) return '音頭：龍笛の首席がひとりで吹き出す'; if(b<16) return '付所：笙と篳篥の首席、打物が入る'; if(b<SEC_BEATS) return '助管：残りの笛の奏者も加わる'; if(b<SEC_BEATS+8) return '琵琶と箏が加わり、16人の合奏に'; }
  return null;
}

/* 拍子の輪 */
const cv=$('#ring'), cx2=cv.getContext('2d');
function sizeRing(){ const r=cv.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1); cv.width=r.width*dpr; cv.height=r.height*dpr; cx2.setTransform(dpr,0,0,dpr,0,0); }
new ResizeObserver(sizeRing).observe(cv); sizeRing();
const KAN=['一','二','三','四'];
function drawRing(pos){
  const W=cv.clientWidth, c=W/2, R=W*.39, g=cx2, css=tokens; g.clearRect(0,0,W,W);
  const ang=b=>-Math.PI/2+(b/16)*Math.PI*2;
  const cyc = pos===null? -1 : ((pos%16)+16)%16;
  for(let q=0;q<4;q++){
    const a0=ang(q*4)+.05, a1=ang(q*4+4)-.05, act = cyc>=q*4 && cyc<q*4+4;
    g.beginPath(); g.arc(c,c,R,a0,a1); g.lineWidth=act?4:1.6; g.strokeStyle=act?css['--ink']:css['--line']; g.lineCap='round'; g.stroke();
    const am=ang(q*4+2), lr=R+W*.075; g.fillStyle=act?css['--ink']:css['--muted']; g.font=`700 ${Math.round(W*.075)}px "Shippori Mincho B1",serif`; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(KAN[q],c+Math.cos(am)*lr,c+Math.sin(am)*lr);
  }
  const flash=(off,len)=> cyc>=0 && cyc>=off && cyc<off+len ? 1-(cyc-off)/len : 0;
  const rk=R-W*.085;
  PERC.filter(p=>p.inst==='kakko').forEach(p=>{ const len = p.k==='sei'?.15 : p.k==='katarai'?1.3:2; const f=state.on.kakko? flash(p.off,Math.max(.6,len)) : 0;
    g.beginPath(); g.arc(c,c,rk,ang(p.off),ang(p.off+len)); g.lineWidth=p.k==='sei'?5:2+f*3; g.strokeStyle=css['--ink']; g.globalAlpha=.25+f*.75; g.lineCap='round'; g.stroke(); g.globalAlpha=1; });
  const rs=R-W*.15;
  PERC.filter(p=>p.inst==='shoko').forEach(p=>{ const a=ang(p.off), f=state.on.shoko?flash(p.off,.5):0, r=(p.k==='chi'?2:3)+f*3;
    g.beginPath(); g.arc(c+Math.cos(a)*rs,c+Math.sin(a)*rs,r,0,7); g.fillStyle=css['--kin']; g.globalAlpha=.45+f*.55; g.fill(); g.globalAlpha=1; });
  PERC.filter(p=>p.inst==='taiko').forEach(p=>{ const a=ang(p.off), f=state.on.taiko?flash(p.off,1):0, big=p.k==='do', r=(big?W*.055:W*.035)*(1+f*.4);
    const x=c+Math.cos(a)*R, y=c+Math.sin(a)*R;
    if(f>0){ g.beginPath(); g.arc(x,y,r+f*W*.06,0,7); g.fillStyle=css['--uchi']; g.globalAlpha=f*.22; g.fill(); g.globalAlpha=1; }
    g.beginPath(); g.arc(x,y,r,0,7); g.fillStyle=css['--uchi']; g.fill();
    g.fillStyle=css['--surface']; g.font=`800 ${Math.round(r*1.05)}px "Shippori Mincho B1",serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(big?'百':'図',x,y+1); });
  if(cyc>=0){ const a=ang(cyc); g.beginPath(); g.arc(c+Math.cos(a)*R,c+Math.sin(a)*R,4.5,0,7); g.fillStyle=css['--ink']; g.fill(); }
}

const lvs={}, hitsNow={};
function frame(ms){
  let pos=null; const clock=ms/1000;
  for(const k in lvs) lvs[k]=0;
  if(perf && ctx){
    const now=ctx.currentTime;
    let k=perf.from; while(perf.beatT[k+1]!==undefined && perf.beatT[k+1]<=now) k++;
    const t0=perf.beatT[k], t1=perf.beatT[k+1];
    pos = now<t0 ? perf.from-.001 : k + (t1? Math.min(1,(now-t0)/(t1-t0)) : 0);
    perf.vis = perf.vis.filter(v=>v.t1>now-1);
    const ilv={};
    for(const v of perf.vis){ if(now>=v.t0 && now<v.t1+.35){
      const sustain=['hichiriki','ryuteki','sho'].includes(v.i);
      const x = now<v.t1 ? (sustain? .9 : 1-(now-v.t0)/(v.t1-v.t0+.001)*.5) : (1-(now-v.t1)/.35)*.35;
      v.ps.forEach(p=>{ if(!(lvs[v.i+p]>x)) lvs[v.i+p]=x; }); if(!(ilv[v.i]>x)) ilv[v.i]=x; } }
    Object.keys(chipsI).forEach(id=>chipsI[id].style.setProperty('--lv',state.on[id]?(ilv[id]||0).toFixed(2):'0'));
    // 打った瞬間（手の動き・波紋）
    perf.hits = perf.hits.filter(h=>h.t>now-.6);
    for(const h of perf.hits){ if(h.t<=now){ const key=h.i+h.p; if(!hitsNow[key] || hitsNow[key].t<h.t){ hitsNow[key]=h; if(three && state.on[h.i] && !h.fired){ h.fired=true; const P=three.players.find(q=>q.id===h.i&&q.p===h.p); if(P && (h.i==='kakko' ? h.s>=.99 : Math.abs(h.s)>=.5)) three.ripple(P,Math.min(1,Math.abs(h.s))); } } } }
    const b=pos, si=Math.floor(Math.max(0,b)/SEC_BEATS);
    if(b<0){ $('#secL').textContent='音'; $('#repL').textContent='音取'; }
    else if(si<FORM.length){ const s=FORM[si]; $('#secL').textContent=s; const nth=FORM.slice(0,si+1).filter(x=>x===s).length; $('#repL').textContent=(perf.ondo && b<8)?'音頭':(nth===1?'一返':'二返'); }
    else { $('#secL').textContent='留'; $('#repL').textContent='留手'; }
    const ci = b<0?0 : si<FORM.length? si+1 : CHIPS.length-1;
    chips.forEach((c,i)=>{ const on=i===ci; c.classList.toggle('on',on);
      let w='0'; if(i<ci) w='100%'; else if(on){ const st=i===0?NETORI:i===CHIPS.length-1?PIECE:(i-1)*SEC_BEATS, len=i===0?-NETORI:i===CHIPS.length-1?END_BEATS:SEC_BEATS; w=Math.min(100,Math.max(0,(b-st)/len*100))+'%'; }
      c.querySelector('.fill').style.width=w; });
    const ph=phaseOf(b); if(ph && ph!==lastPhase){ lastPhase=ph; showCaption(ph); }
  } else { Object.keys(chipsI).forEach(id=>chipsI[id].style.setProperty('--lv','0')); }
  drawRing(pos!==null && pos>=0 && pos<PIECE ? pos : null);
  if(three) three.render(ctx?ctx.currentTime:0,lvs,hitsNow,clock,pos);
  requestAnimationFrame(frame);
}

const dlg=$('#dlg'), body=$('#dlgBody');
function openSheet(html,color){ body.innerHTML=html; body.style.setProperty('--g',color||'var(--kin)'); dlg.showModal(); body.querySelector('.x').onclick=()=>dlg.close(); body.scrollTop=0; }
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
dlg.addEventListener('close',()=>padStopAll());
const top=(h,y,extra='')=>`<div class="shtop"><div><div class="yomi">${y}</div><h2>${h}</h2>${extra}</div><span class="sp"></span><button class="x" aria-label="閉じる">×</button></div>`;
const PLAYI='<svg viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.5v9l7.5-4.5z"/></svg>';
let padWinds={}, padSho=null;
function padStopAll(){ Object.values(padWinds).forEach(w=>w.release()); if(padSho&&ctx){ padSho.off(ctx.currentTime); } }
function hold(el,on,off){
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); if(ctx.state==='suspended') ctx.resume(); el.setPointerCapture(e.pointerId); el.classList.add('hit'); on(); });
  const end=()=>{ if(!el.classList.contains('hit')) return; el.classList.remove('hit'); off&&off(); };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); el.addEventListener('lostpointercapture',end);
}
function tap(el,fn){ el.addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); if(ctx.state==='suspended') ctx.resume(); el.classList.add('hit'); fn(); setTimeout(()=>el.classList.remove('hit'),140); }); }
function openInst(id){
  const I=INST[id], G=INST_GROUP[id];
  let pads='', label='';
  const notes=[64,66,69,71,73,74,76];
  if(id==='sho'){ label='合竹を押さえて鳴らす'; pads=Object.keys(AITAKE).map(n=>`<button class="pad" data-a="${n}"><b>${n.replace('(双)','')}</b><small>${n.includes('双')?'双調の曲用':RITSU[AITAKE_ROOT[n]]}</small></button>`).join(''); }
  else if(id==='hichiriki'||id==='ryuteki'){ label='押さえて吹く'; pads=notes.map(m=>`<button class="pad" data-m="${id==='ryuteki'?m+12:m}"><b>${WEST[pc(m)]}</b><small>${RITSU[pc(m)]}</small></button>`).join(''); }
  else if(id==='biwa'){ label='撥でかき鳴らす'; pads=notes.map(m=>{ let t=inRange(m,52); if(t===52) t=64; return `<button class="pad" data-m="${t}"><b>${WEST[pc(m)]}</b><small>${RITSU[pc(m)]}</small></button>`;}).join(''); }
  else if(id==='koto'){ label='型で弾く'; pads=`<button class="pad wide" data-k="shizu"><b>閑掻</b><small>しずがき</small></button><button class="pad wide" data-k="haya"><b>早掻</b><small>はやがき</small></button>`; }
  else if(id==='kakko'){ label='打ってみる'; pads=`<button class="pad" data-k="sei"><b>正</b><small>せい</small></button><button class="pad wide" data-k="katarai"><b>片来</b><small>かたらい</small></button><button class="pad wide" data-k="morobai"><b>諸来</b><small>もろらい</small></button>`; }
  else if(id==='taiko'){ label='打ってみる'; pads=`<button class="pad wide" data-k="zu"><b>図</b><small>ズン・左</small></button><button class="pad wide" data-k="do"><b>百</b><small>ドウ・右</small></button>`; }
  else { label='打ってみる'; pads=`<button class="pad wide" data-k="chi"><b>チ</b><small>左</small></button><button class="pad wide" data-k="chin"><b>チン</b><small>右</small></button>`; }
  const enb = id==='hichiriki' ? `<div class="sw"><div class="t"><span>塩梅</span><small>音を下からすくい上げる</small></div><button class="tog" id="enbT" role="switch" aria-checked="true" aria-label="塩梅"></button></div>` : '';
  openSheet(`${top(I.k,I.y,`<div style="margin-top:6px"><span class="tag">${G.k}・${I.role}・${I.n}人</span></div>`)}
    <p class="lead">${I.lead}</p>
    <div class="padlabel">${label}</div><div class="pads">${pads}</div>${enb}
    ${I.more.map(([h,t])=>`<details><summary>${h}</summary><p>${t}</p></details>`).join('')}`, `var(${G.tok})`);
  const spb=60/state.bpm;
  if(id==='hichiriki'){ const t=$('#enbT'); t.onclick=()=>t.setAttribute('aria-checked', t.getAttribute('aria-checked')!=='true'); }
  body.querySelectorAll('.pad').forEach(p=>{
    const out=padBus;
    if(id==='sho') hold(p,()=>{ if(!padSho) padSho=new Sho(out); padSho.chord(ctx.currentTime,p.dataset.a,.035); },()=>padSho.off(ctx.currentTime));
    else if(id==='hichiriki'||id==='ryuteki') hold(p,()=>{ if(!padWinds[id]) padWinds[id]=new Wind(id,out); const en = id==='hichiriki' ? $('#enbT').getAttribute('aria-checked')==='true' : false; padWinds[id].hold(f0(+p.dataset.m),en); },()=>padWinds[id].release());
    else if(id==='biwa') tap(p,()=>biwaArp(ctx.currentTime+.25,[40,47,52,+p.dataset.m],out));
    else if(id==='koto') tap(p,()=>kotoPattern(p.dataset.k,ctx.currentTime+.08,69,spb,out));
    else if(id==='kakko') tap(p,()=>kakkoStroke(p.dataset.k,ctx.currentTime+.02,spb,out));
    else tap(p,()=>drum(id,ctx.currentTime+.01,p.dataset.k,1,out));
  });
}
const LEARN = [
  {q:'16人・3つの列', p:'管絃は「三管・両絃・三鼓」。笛（吹物）が3人ずつ、弦（弾物）が2人ずつ、打楽器（打物）が1人ずつの16人。いちばん前に打物、次に弾物、いちばん後ろに吹物が座ります。後ろの人から前の人の手の動きが見えるので、指揮者なしで合わせられます。',
    a:[['吹物だけ',()=>playWith(['sho','hichiriki','ryuteki'],SEC_BEATS)],['弾物だけ',()=>playWith(['biwa','koto'],SEC_BEATS)],['打物だけ',()=>playWith(['kakko','taiko','shoko'],SEC_BEATS)]]},
  {q:'旋律は篳篥、飾りは龍笛', p:'中心の旋律を吹くのは篳篥。龍笛は同じ旋律を高い音で、飾りをつけながら追いかけます。同じ楽器の3人も少しずつずれ、独特の厚みが生まれます。',
    a:[['篳篥だけ',()=>playWith(['hichiriki'],SEC_BEATS)],['篳篥＋龍笛',()=>playWith(['hichiriki','ryuteki'],SEC_BEATS)]]},
  {q:'笙の和音「合竹」', p:'笙は5〜6音を同時に鳴らす和音で全体を包みます。旋律の音が変わると、指を一本ずつ移して次の和音へ。響きが途切れないのはこのためです。',
    a:[['笙だけ',()=>playWith(['sho'],SEC_BEATS)],['笙＋篳篥',()=>playWith(['sho','hichiriki'],SEC_BEATS)]]},
  {q:'早四拍子（はやよひょうし）', p:'4つの小拍子でひとめぐり。輪の三つ目で太鼓が小さく「図」、四つ目で大きく「百」。百のとき鞨鼓と鉦鼓も同時に打ち、いちばん強い節目になります。鞨鼓の「諸来」がそこへ向かって速くなります。',
    a:[['打物だけで聴く',()=>playWith(['kakko','taiko','shoko'],SEC_BEATS)]]},
  {q:'A A B B C C の形', p:'越天楽は3つの旋律A・B・Cを、それぞれ二回ずつくり返します。AとBは同じ終わり方で結ばれます。下の文字をタップすると、その段から聴けます。',
    a:[['Bから',()=>{only(Object.keys(INST));start(SEC_BEATS*2);}],['Cから',()=>{only(Object.keys(INST));start(SEC_BEATS*4);}]]},
  {q:'始まり方と終わり方', p:'まず「音取（ねとり）」で、笙→篳篥→龍笛→鞨鼓→琵琶・箏の順に音を合わせます。曲は龍笛の首席のひとり吹き「音頭」から。合図の場所（付所）で笙・篳篥の首席と打物が入り、残りの奏者、琵琶と箏が続きます。最後は琵琶と箏だけの「留手」。',
    a:[['音取から',()=>{only(Object.keys(INST));state.ondo=true;savePref();start(NETORI);}],['最初から',()=>{only(Object.keys(INST));state.ondo=true;savePref();start(0);}],['終わりを聴く',()=>{only(Object.keys(INST));start(SEC_BEATS*5+16);}]]},
  {q:'拍は等間隔ではない', p:'雅楽の拍は、息に合わせて伸び縮みします。2拍目から3拍目へ移るところで少し「ためる」のが特徴。曲全体も、ごくわずかずつ速くなっていきます。',
    a:[['ゆらぎあり',()=>{state.yuragi=true;savePref();only(Object.keys(INST));start(SEC_BEATS);}],['ゆらぎなし',()=>{state.yuragi=false;savePref();only(Object.keys(INST));start(SEC_BEATS);}]]},
];
function playWith(list,from=0){ only(list); start(from); dlg.close(); }
const NUM=['一','二','三','四','五','六','七'];
$('#learnBtn').onclick=()=>{
  openSheet(`${top('雅楽のしくみ','ががく')}<div class="learn">${LEARN.map((l,i)=>`<div class="card"><button class="h" aria-expanded="false"><span class="n">${NUM[i]}</span><span class="q">${l.q}</span><span class="chev">›</span></button><div class="b"><p>${l.p}</p><div class="acts">${l.a.map((a,j)=>`<button class="act" data-i="${i}" data-j="${j}">${PLAYI}${a[0]}</button>`).join('')}</div></div></div>`).join('')}</div>`);
  body.querySelectorAll('.card .h').forEach(h=>h.onclick=()=>{ const c=h.parentElement, o=!c.classList.contains('open'); c.classList.toggle('open',o); h.setAttribute('aria-expanded',o); });
  body.querySelectorAll('.act').forEach(b=>b.onclick=()=>{ LEARN[+b.dataset.i].a[+b.dataset.j][1](); dlg.close(); });
  body.querySelector('.card').classList.add('open');
};
$('#setBtn').onclick=()=>{
  openSheet(`${top('設定','せってい')}
    <div class="sw" style="border-top:0;display:grid;gap:4px"><div class="t"><span>テンポ　♩=<b id="bpmV">${state.bpm}</b></span><small>実際の演奏は 50〜60 くらい</small></div><input type="range" id="bpmR" min="36" max="90" step="1" value="${state.bpm}" aria-label="テンポ"></div>
    <div class="sw"><div class="t"><span>ゆらぎ</span><small>2拍目から3拍目へ少しためる</small></div><button class="tog" id="yT" role="switch" aria-checked="${state.yuragi}" aria-label="ゆらぎ"></button></div>
    <div class="sw"><div class="t"><span>音頭から始める</span><small>龍笛のひとり吹きから、奏者が順に加わる</small></div><button class="tog" id="oT" role="switch" aria-checked="${state.ondo}" aria-label="音頭から始める"></button></div>`);
  $('#bpmR').oninput=e=>setBpm(+e.target.value);
  $('#yT').onclick=e=>{ state.yuragi=!state.yuragi; e.currentTarget.setAttribute('aria-checked',state.yuragi); savePref(); };
  $('#oT').onclick=e=>{ state.ondo=!state.ondo; e.currentTarget.setAttribute('aria-checked',state.ondo); savePref(); };
};
$('#songInfo').onclick=()=>{
  openSheet(`${top('越天楽','えてんらく')}
    <p class="lead">雅楽でいちばんよく知られた曲。舞をともなわない「管絃」として、16人・8種の楽器で演奏されます。</p>
    <details open><summary>平調（ひょうじょう）</summary><p>E（平調の音）を中心にした調子。笙の和音もこの調子の響きでできています。</p></details>
    <details><summary>早四拍子</summary><p>4つの小拍子で太鼓がひとめぐりする拍子。1つの段（A・B・C）は8小拍子です。</p></details>
    <details><summary>今様・黒田節</summary><p>この旋律に歌詞をつけた「越天楽今様」が平安時代に流行し、のちの民謡「黒田節」にもつながりました。</p></details>
    <p class="note">旋律（篳篥・龍笛）の音は現在仮のデータです。楽譜と照合して差し替え予定。笙の合竹の構成音、曲の形式、編成と座り方、楽器の加わる順番は資料にもとづいています。音取は簡略化しています。</p>`);
};

renderSwitches(); updatePlay();
try{ initThree(); }catch(e){ console.error(e); }
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{ if(document.hidden && perf) stop(); });
