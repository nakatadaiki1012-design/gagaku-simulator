<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; }
  body{ width:1280px; height:670px; overflow:hidden; position:relative; font-family:'Zen Kaku Gothic New',sans-serif; color:#fff;
        background:radial-gradient(circle at 78% 35%, #3a1d4a 0%, #141a33 50%, #0a0d1c 100%); }
  body:before{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(90deg, rgba(212,175,90,.06) 0 1px, transparent 1px 64px); }
  .shot{ position:absolute; border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 3px rgba(212,175,90,.5); }
  .shot img{ display:block; width:100%; }
  .s1{ width:640px; right:-60px; top:46px; transform:rotate(3deg); }
  .s2{ width:300px; right:400px; top:380px; transform:rotate(-5deg); }
  .phone{ position:absolute; width:170px; right:60px; top:330px; border-radius:26px; overflow:hidden; transform:rotate(6deg);
          box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 0 6px #111, 0 0 0 8px rgba(212,175,90,.4); }
  .phone img{ display:block; width:100%; }
  .copy{ position:absolute; left:60px; top:64px; width:680px; z-index:5; text-shadow:0 4px 24px rgba(0,0,0,.85); }
  .tag{ display:inline-block; font-weight:700; font-size:22px; padding:6px 18px; border-radius:999px; background:#c8352b; color:#fff; text-shadow:none; }
  h1{ font-family:'Shippori Mincho B1',serif; font-size:56px; line-height:1.25; margin:24px 0 18px; font-weight:800; }
  h1 em{ font-style:normal; color:#e8c46a; }
  p{ font-size:24px; line-height:1.6; margin:0; font-weight:500; color:#e6e2f0; }
  .badge{ position:absolute; left:60px; bottom:104px; z-index:5; display:flex; gap:10px; }
  .badge div{ font-size:18px; font-weight:700; padding:6px 14px; border-radius:10px; background:rgba(255,255,255,.1); border:1px solid rgba(212,175,90,.5); }
  .logo{ position:absolute; left:60px; bottom:40px; z-index:5; font-family:'Shippori Mincho B1',serif; font-weight:800; font-size:40px; letter-spacing:.12em; }
  .logo span{ font-size:20px; color:#e8c46a; margin-left:14px; letter-spacing:.05em; font-family:'Zen Kaku Gothic New',sans-serif; }
</style></head>
<body>
  <div class="shot s1"><img src="src/stage.png"></div>
  <div class="shot s2"><img src="src/zoom.png"></div>
  <div class="phone"><img src="src/phone.png"></div>
  <div class="copy">
    <span class="tag">いま誰が演奏しているか、光で見える</span>
    <h1>3Dの雅楽隊と<br><em>『越天楽』</em>を合奏</h1>
    <p>本物の楽譜から作った、16人の雅楽隊<br>授業で使える雅楽シミュレーター</p>
  </div>
  <div class="badge"><div>🎼 楽譜に忠実</div><div>🥁 合奏に参加</div><div>📱 スマホOK</div></div>
  <div class="logo">越天楽<span>雅楽シミュレーター</span></div>
</body></html>
